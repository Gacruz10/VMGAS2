<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Gestión de Clientes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(0, 0, 0, 0.6);
    --glass-border: rgba(255, 255, 255, 0.15);
    --input-bg: rgba(0, 0, 0, 0.4);
    --text-primary: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.6);
    --accent: #F97316; 
    --success: #4CAF50;
    --error: #ff5e5e;
    --cat-bg: rgba(255, 255, 255, 0.05);
    --row-bg: rgba(255, 255, 255, 0.02);
    --row-hover: rgba(255, 255, 255, 0.08);
  }

  body.light-mode {
    --glass: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(0, 0, 0, 0.15);
    --input-bg: rgba(255, 255, 255, 0.9);
    --text-primary: #1a1a1a;
    --text-muted: rgba(0, 0, 0, 0.6);
    --cat-bg: rgba(0, 0, 0, 0.03);
    --row-bg: #ffffff;
    --row-hover: #f1f5f9;
    background: #f8fafc !important;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; font-family: 'Inter', sans-serif; color: var(--text-primary);
    background: radial-gradient(at 0% 0%, #1e053a 0%, transparent 50%),
                radial-gradient(at 100% 0%, #310d5e 0%, transparent 50%),
                radial-gradient(at 100% 100%, #0d031a 0%, transparent 50%),
                radial-gradient(at 0% 100%, #214d7a 0%, transparent 50%);
    background-color: #0d031a; background-attachment: fixed; min-height: 100vh;
    opacity: 0; transition: opacity 0.3s ease; padding-bottom: 80px; 
  }

  .theme-toggle {
    position: absolute; top: 15px; left: 15px; width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-primary);
    display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer;
    backdrop-filter: blur(10px); z-index: 1000;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 10px; }
  h1 { text-align: center; color: var(--accent); margin: 5px 0 15px 0; font-size: 24px; }
  
  /* STICKY TOOLBAR */
  .toolbar {
    position: sticky; top: 5px; z-index: 100;
    display: flex; flex-direction: column; gap: 10px; align-items: center; margin-bottom: 20px;
    background: var(--glass); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  @media(min-width: 700px){ .toolbar { flex-direction: row; justify-content: space-between; } }

  .search-box { position: relative; width: 100%; max-width: 450px; }
  .search-input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--glass-border);
    padding: 10px 15px 10px 40px; border-radius: 8px; color: var(--text-primary); outline: none; font-size: 14px;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.6; }

  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn { border: none; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: rgba(128,128,128,0.2); color: var(--text-primary); font-size: 12px; transition: 0.2s;}
  .btn:hover { background: var(--accent); color: #000; }
  .btn-new { background: var(--success); color: white; }
  .btn-new:hover { background: #43A047; color: white; }

  /* ACORDEÓN DE CATEGORÍAS */
  .category-group { margin-bottom: 15px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; backdrop-filter: blur(10px); }
  
  /* STICKY CATEGORY HEADER */
  .category-header { 
    position: sticky; top: 110px; z-index: 90; 
    background: var(--cat-bg); padding: 12px 15px; font-weight: 800; font-size: 13px; letter-spacing: 1px; color: var(--accent); 
    display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-transform: uppercase;
    border-radius: 10px; backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05);
  }
  @media(min-width: 700px){ .category-header { top: 70px; } }
  .category-group.open .category-header { border-radius: 10px 10px 0 0; }
  .category-header:hover { background: rgba(249, 115, 22, 0.1); }
  
  .category-content { display: none; }
  .category-group.open .category-content { display: block; border-radius: 0 0 10px 10px; overflow: hidden; }
  
  /* LISTA DE CLIENTES */
  .cli-item { border-top: 1px solid var(--glass-border); background: var(--row-bg); transition: 0.2s; }
  .cli-summary { 
    padding: 12px 15px; display: grid; grid-template-columns: 75px 1fr 100px 40px; gap: 8px; align-items: center; 
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .cli-summary:hover { background: var(--row-hover); }
  .cli-id { color: var(--text-muted); font-size: 11px; font-family: monospace;}
  .cli-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px;}
  .cli-phone { color: var(--text-muted); font-size: 12px; text-align: right; }
  .cli-map { text-align: center; font-size: 16px; text-decoration: none; display: flex; justify-content: center; align-items: center; width: 30px; height: 30px; border-radius: 50%; }
  .cli-map.active { background: rgba(76, 175, 80, 0.15); }
  .cli-map.inactive { filter: grayscale(100%); opacity: 0.2; pointer-events: none; }
  
  .badge-acuerdo { background: var(--success); width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px var(--success); }

  /* DETALLES DESPLEGABLES */
  .cli-details { background: rgba(0,0,0,0.3); padding: 15px; border-top: 1px dashed var(--glass-border); display: none; }
  body.light-mode .cli-details { background: rgba(0,0,0,0.03); }
  
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .input-group { display: flex; flex-direction: column; gap: 4px; }
  .input-group label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  
  input, select { 
    background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 6px; padding: 8px; 
    color: var(--text-primary); outline: none; font-size: 13px; font-family: 'Inter', sans-serif;
  }
  input:focus, select:focus { border-color: var(--accent); }
  body.light-mode input, body.light-mode select { color-scheme: light; }
  select option { background: #1a0b2e; color: #fff; }
  body.light-mode select option { background: #fff; color: #000; }

  /* PRECIOS ACORDEON RESPONSIVO */
  .prices-box { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 8px; padding: 12px; margin-top: 5px; }
  .prices-title { font-size: 11px; color: var(--accent); font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
  
  .prices-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
  @media(min-width: 500px){ .prices-grid { grid-template-columns: repeat(3, 1fr); } }
  
  .prices-grid .input-group label { text-align: left; font-size: 9px; }
  .prices-grid input { text-align: left; padding: 8px; font-family: monospace; font-size: 14px;}

  /* FOOTER & MODAL */
  footer { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--glass-border); backdrop-filter: blur(10px); z-index: 900; }
  body.light-mode footer { background: rgba(255,255,255,0.95); }
  
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;}
  .modal-content { background: #1a0b2e; border: 1px solid var(--accent); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative;}
  body.light-mode .modal-content { background: #f8fafc; }
  
  .modal-header { text-align: center; margin-bottom: 15px; color: var(--accent); font-size: 18px; font-weight: 800; }
  .btn-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
  .btn-add { width: 100%; background: var(--accent); color: #000; padding: 12px; margin-top: 15px; font-weight: 800; border: none; border-radius: 8px;}
  .btn-add:disabled { background: #555; color: #888; }

  /* UTILS */
  #toast-container { position: fixed; bottom: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { padding: 12px 20px; border-radius: 8px; color: #fff; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid var(--glass-border); opacity: 0; transform: translateY(20px); transition: 0.3s; font-size: 13px;}
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: rgba(255, 94, 94, 0.95); }
  .toast.success { background: rgba(76, 175, 80, 0.95); }
  .toast.info { background: rgba(249, 115, 22, 0.95); color: #000; }

  .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--glass); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(10px); }
  .loading-overlay.active { opacity: 1; visibility: visible; }
  .spinner { width: 50px; height: 50px; border: 4px solid rgba(249, 115, 22, 0.1); border-left-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .loading-text { color: var(--accent); font-size: 13px; font-weight: 800; letter-spacing: 2px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<script>
  if(localStorage.getItem('vm_theme') === 'light') document.body.classList.add('light-mode');
</script>
<button class="theme-toggle" onclick="window.toggleTheme()" id="btnTheme">🌙</button>

<div id="toast-container"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="loading-text" id="loaderText">CARGANDO...</div></div>

<div class="wrap">
  <h1>DIRECTORIO DE CLIENTES</h1>
  
  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="txtBuscar" class="search-input" placeholder="Buscar cliente, dirección, CUIT, zona..." oninput="window.filterData()">
    </div>
    <div class="toolbar-actions">
        <button class="btn btn-new" onclick="window.abrirModal()">➕ NUEVO CLIENTE</button>
        <button class="btn" onclick="window.iniciarCargaDatos()">🔄 Recargar</button>
        <button class="btn" onclick="window.volver()">🏠 Volver</button>
    </div>
  </div>

  <div id="gridContainer"></div>
</div>

<footer>
  <button class="btn" id="btnGuardar" onclick="window.save()" style="min-width: 250px; font-weight:800; background:var(--accent); color:#000;">💾 GUARDAR CAMBIOS</button>
</footer>

<!-- MODAL ALTA COMPLETA -->
<div id="modalNuevo" class="modal-overlay">
  <div class="modal-content">
    <button class="btn-close" onclick="window.cerrarModal()">✕</button>
    <div class="modal-header">ALTA NUEVO CLIENTE</div>
    
    <div class="detail-grid" style="margin-bottom: 5px;">
        <div class="input-group" style="grid-column: 1 / -1;">
            <label>NOMBRE COMERCIO / CLIENTE</label>
            <input type="text" id="newNombre" placeholder="Ej: Kiosco Pepe" oninput="window.validateModal()">
        </div>
        <div class="input-group">
            <label>ZONA</label>
            <select id="newZona" onchange="window.validateModal()"><option value="">Cargando...</option></select>
        </div>
        <div class="input-group">
            <label>CATEGORÍA</label>
            <select id="newCategoria" onchange="window.validateModal()"><option value="">Cargando...</option></select>
        </div>
        <div class="input-group">
            <label>TELÉFONO</label>
            <input type="text" id="newTelefono" oninput="window.validateModal()">
        </div>
        <div class="input-group">
            <label>DIRECCIÓN</label>
            <input type="text" id="newDireccion" oninput="window.validateModal()">
        </div>
        <div class="input-group">
            <label>COORDENADAS (GPS)</label>
            <input type="text" id="newCoordenadas" placeholder="Ej: -29.418, -66.875">
        </div>
        <div class="input-group">
            <label>CUIT / DNI</label>
            <input type="text" id="newCuit">
        </div>
    </div>

    <div class="prices-box">
      <div class="prices-title">ACUERDO COMERCIAL (Opcional)</div>
      <div class="prices-grid">
         <div class="input-group"><label>Solo Gas 10k</label><input type="number" id="new_p10"></div>
         <div class="input-group"><label>Solo Gas 15k</label><input type="number" id="new_p15"></div>
         <div class="input-group"><label>Solo Gas 45k</label><input type="number" id="new_p45"></div>
         <div class="input-group"><label>C/Envase 10k</label><input type="number" id="new_e10"></div>
         <div class="input-group"><label>C/Envase 15k</label><input type="number" id="new_e15"></div>
         <div class="input-group"><label>C/Envase 45k</label><input type="number" id="new_e45"></div>
      </div>
      <div class="input-group">
         <label>Vencimiento Acuerdo</label>
         <input type="date" id="newVencimiento">
      </div>
    </div>

    <button class="btn-add" id="btnAddClient" onclick="window.agregarCliente()" disabled>AGREGAR CLIENTE</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCesmFFsn7LvgmcFMWFfi6F5_Zvco79ucM",
    authDomain: "vmgaslr.firebaseapp.com",
    projectId: "vmgaslr",
    storageBucket: "vmgaslr.firebasestorage.app",
    messagingSenderId: "75859850089",
    appId: "1:75859850089:web:fc551c770bbf4ae25803f8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TIMEOUT_SESION = 300000;

let GLOBAL_ZONAS = ["ZONA1", "ZONA2"];
let GLOBAL_CATEGORIAS = ["USUARIO (PUBLICO)", "COMERCIO", "SUBDISTRIBUIDOR", "ROT. Y PAN."];
let rows = [];

window.toggleTheme = function() {
    const isLight = document.body.classList.toggle('light-mode');
    document.getElementById('btnTheme').textContent = isLight ? '☀️' : '🌙';
    localStorage.setItem('vm_theme', isLight ? 'light' : 'dark');
};
document.getElementById('btnTheme').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';

function showToast(msg, type = 'info') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`; t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
}

function toggleLoader(show, text = 'CARGANDO...') {
    document.getElementById('loaderText').textContent = text;
    const overlay = document.getElementById('loadingOverlay');
    if (show) overlay.classList.add('active'); else overlay.classList.remove('active');
}

const params = new URLSearchParams(window.location.search);
const k = params.get('k') || params.get('token') || sessionStorage.getItem('vm_token');

function expulsar() { sessionStorage.clear(); window.location.replace('index.html'); }
window.volver = () => window.location.replace(`inicio.html?k=${k}`);

if (!k) expulsar();
else {
    if (window.history.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
    validarSesion();
}

let tIdle;
function resetTimer() { clearTimeout(tIdle); tIdle = setTimeout(expulsar, TIMEOUT_SESION); }
['click','mousemove','keydown'].forEach(ev => document.addEventListener(ev, resetTimer));
resetTimer();

async function validarSesion() {
  try {
    document.body.style.opacity = 1;
    if (!navigator.onLine) return window.iniciarCargaDatos();
    toggleLoader(true, "VERIFICANDO SESIÓN...");
    const docRef = doc(db, "tokens", k);
    const docSnap = await getDoc(docRef);
    if (!docSnap.exists() || (docSnap.data().expira && Date.now() > docSnap.data().expira)) throw new Error();
    sessionStorage.setItem('usuarioActivo', docSnap.data().usuario || 'SISTEMA');
    window.iniciarCargaDatos();
  } catch (e) { expulsar(); }
}

// ---------------- UTILIDADES ----------------
function removeAccents(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function formatDateForInput(ds) {
    if (!ds) return '';
    if(ds.includes('/')){ let p=ds.split('/'); return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }
    return ds;
}
function esAcuerdoVigente(ds) {
    if (!ds) return false;
    let d = new Date(formatDateForInput(ds) + "T00:00:00");
    let hoy = new Date(); hoy.setHours(0,0,0,0);
    return d >= hoy;
}
function llenarSelectHtml(opciones, valor = "") {
    return `<option value="">-- Seleccionar --</option>` + opciones.map(op => `<option value="${op}" ${op===valor?'selected':''}>${op}</option>`).join('');
}

// ---------------- CARGA DE DATOS DESDE FIREBASE ----------------
window.iniciarCargaDatos = async function() {
    toggleLoader(true, "CARGANDO DATOS...");
    try {
        if (navigator.onLine) {
            // Intentamos traer Zonas y Categorías desde un documento de configuración si existe
            try {
               const docConfig = await getDoc(doc(db, "configuracion", "listas"));
               if (docConfig.exists()) {
                   GLOBAL_ZONAS = docConfig.data().zonas || GLOBAL_ZONAS;
                   GLOBAL_CATEGORIAS = docConfig.data().categorias || GLOBAL_CATEGORIAS;
               }
            } catch(e) {} // Fallback silencioso a las listas duras de arriba

            const querySnapshot = await getDocs(collection(db, "clientes"));
            rows = [];
            
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                data.id = docSnap.id; // Guardamos la llave primaria nativa
                
                // CHISMOSO: Guardamos un clon limpio como texto para comparar rápido en el guardado
                const { id, _idx, _original, _isNew, ...cleanData } = data;
                data._original = JSON.stringify(cleanData);
                
                rows.push(data);
            });
            
            localStorage.setItem('vm_clientes_data', JSON.stringify(rows));
        } else {
            rows = JSON.parse(localStorage.getItem('vm_clientes_data') || '[]');
            showToast('Modo sin conexión', 'info');
        }
        buildUI();
    } catch(e) { 
        console.error(e);
        showToast("Error cargando base de clientes.", "error"); 
    }
};

// ---------------- RENDER UI (LAZY & ACORDEÓN) ----------------
function buildUI() {
    const agrupado = {};
    GLOBAL_CATEGORIAS.forEach(c => agrupado[c] = []);
    agrupado['OTRO'] = [];

    rows.forEach((r, idx) => {
        let cat = r.categoria || r.tipo || 'OTRO'; // Tolerancia a como venga del TSV
        if(!agrupado[cat]) cat = 'OTRO';
        r._idx = idx; 
        agrupado[cat].push(r);
    });

    let html = '';
    for (const cat in agrupado) {
        if(agrupado[cat].length === 0) continue;
        
        html += `
        <div class="category-group" id="grp-${cat.replace(/\s+/g, '')}">
           <div class="category-header" onclick="this.parentElement.classList.toggle('open')">
              <span>📂 ${cat}</span>
              <span class="count" style="background:var(--accent); color:#000; padding:2px 8px; border-radius:10px;">${agrupado[cat].length}</span>
           </div>
           <div class="category-content">`;
        
        agrupado[cat].forEach(r => {
            const vig = esAcuerdoVigente(r.vencimiento);
            const badge = vig ? '<span class="badge-acuerdo" title="Acuerdo Activo"></span>' : '';
            const mapClass = r.coordenadas ? 'active' : 'inactive';
            const mapLink = r.coordenadas ? `href="https://maps.google.com/?q=${r.coordenadas}" target="_blank"` : `href="javascript:void(0)"`;

            html += `
            <div class="cli-item search-target" data-search="${removeAccents((r.nombre||'')+' '+(r.direccion||'')+' '+(r.cuit_dni||'')+' '+(r.zona||''))}">
                <div class="cli-summary" onclick="window.toggleRow(this)">
                    <div class="cli-id">${r.id_cliente||'N/A'}</div>
                    <div class="cli-name">${badge} ${r.nombre||''}</div>
                    <div class="cli-phone">${r.telefono||''}</div>
                    <a ${mapLink} class="cli-map ${mapClass}" onclick="event.stopPropagation()">📍</a>
                </div>
                
                <div class="cli-details">
                    <div class="detail-grid">
                        <div class="input-group"><label>Zona</label><select onchange="window.syncData(${r._idx}, this, 'zona')">${llenarSelectHtml(GLOBAL_ZONAS, r.zona)}</select></div>
                        <div class="input-group"><label>Categoría</label><select onchange="window.syncData(${r._idx}, this, 'categoria')">${llenarSelectHtml(GLOBAL_CATEGORIAS, r.categoria || r.tipo)}</select></div>
                        <div class="input-group"><label>Dirección</label><input type="text" value="${r.direccion||''}" oninput="window.syncData(${r._idx}, this, 'direccion')"></div>
                        <div class="input-group"><label>Teléfono</label><input type="text" value="${r.telefono||''}" oninput="window.syncData(${r._idx}, this, 'telefono')"></div>
                        <div class="input-group"><label>CUIT/DNI</label><input type="text" value="${r.cuit_dni||''}" oninput="window.syncData(${r._idx}, this, 'cuit_dni')"></div>
                        <div class="input-group"><label>Coordenadas</label><input type="text" value="${r.coordenadas||''}" placeholder="-29.418, -66.875" oninput="window.syncData(${r._idx}, this, 'coordenadas')"></div>
                    </div>
                    
                    <div class="prices-box">
                        <div class="prices-title">ACUERDO COMERCIAL ${vig?'<span style="color:var(--success); font-size:9px;">(VIGENTE)</span>':''}</div>
                        <div class="prices-grid">
                           <div class="input-group"><label>Gas 10k</label><input type="number" value="${r.p_esp_10||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_10')"></div>
                           <div class="input-group"><label>Gas 15k</label><input type="number" value="${r.p_esp_15||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_15')"></div>
                           <div class="input-group"><label>Gas 45k</label><input type="number" value="${r.p_esp_45||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_45')"></div>
                           <div class="input-group"><label>C/Env 10k</label><input type="number" value="${r.p_esp_env_10||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_env_10')"></div>
                           <div class="input-group"><label>C/Env 15k</label><input type="number" value="${r.p_esp_env_15||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_env_15')"></div>
                           <div class="input-group"><label>C/Env 45k</label><input type="number" value="${r.p_esp_env_45||''}" oninput="window.syncData(${r._idx}, this, 'p_esp_env_45')"></div>
                        </div>
                        <div class="input-group">
                           <label>Vencimiento Acuerdo</label>
                           <input type="date" value="${formatDateForInput(r.vencimiento)}" onchange="window.syncData(${r._idx}, this, 'vencimiento')">
                        </div>
                    </div>
                </div>
            </div>`;
        });
        html += `</div></div>`;
    }

    requestAnimationFrame(() => {
        document.getElementById('gridContainer').innerHTML = html;
        requestAnimationFrame(() => toggleLoader(false));
    });
}

window.toggleRow = function(el) {
    const details = el.nextElementSibling;
    const isVisible = details.style.display === 'block';
    el.closest('.category-content').querySelectorAll('.cli-details').forEach(d => d.style.display = 'none');
    if(!isVisible) details.style.display = 'block';
};

window.syncData = function(idx, input, field) {
    let val = input.value.trim();
    if (field === 'nombre' || field === 'direccion') val = val.toUpperCase();
    if (field === 'vencimiento' && val.includes('-')) {
        let p = val.split('-'); val = `${p[2]}/${p[1]}/${p[0]}`;
    }
    rows[idx][field] = val;

    if (field === 'coordenadas') {
        const mapIcon = input.closest('.cli-item').querySelector('.cli-map');
        if (val) {
            mapIcon.classList.remove('inactive'); mapIcon.classList.add('active');
            mapIcon.href = `https://maps.google.com/?q=${val}`;
            mapIcon.target = "_blank";
        } else {
            mapIcon.classList.add('inactive'); mapIcon.classList.remove('active');
            mapIcon.href = "javascript:void(0)";
            mapIcon.removeAttribute('target');
        }
    }
};

window.filterData = function() {
    const term = removeAccents(document.getElementById('txtBuscar').value);
    const groups = document.querySelectorAll('.category-group');
    
    groups.forEach(grp => {
        let hasVisible = false;
        const items = grp.querySelectorAll('.search-target');
        items.forEach(item => {
            const dataSearch = item.getAttribute('data-search');
            const words = term.split(' ').filter(w => w);
            const match = words.every(w => dataSearch.includes(w));
            
            if(match) { item.classList.remove('hidden'); hasVisible = true; } 
            else { item.classList.add('hidden'); }
        });
        
        if(hasVisible || term === '') {
            grp.classList.remove('hidden');
            if(term !== '') grp.classList.add('open'); else grp.classList.remove('open');
        } else {
            grp.classList.add('hidden');
        }
    });
};

// ---------------- MODAL LOGIC ----------------
window.abrirModal = function() {
    document.getElementById('modalNuevo').style.display = 'flex';
    document.getElementById('newZona').innerHTML = llenarSelectHtml(GLOBAL_ZONAS);
    document.getElementById('newCategoria').innerHTML = llenarSelectHtml(GLOBAL_CATEGORIAS);
    document.querySelectorAll('#modalNuevo input, #modalNuevo select').forEach(i => i.value = '');
    document.getElementById('btnAddClient').disabled = true;
    setTimeout(() => document.getElementById('newNombre').focus(), 100);
};

window.cerrarModal = () => document.getElementById('modalNuevo').style.display = 'none';

window.validateModal = function() {
    const n = document.getElementById('newNombre').value.trim();
    const z = document.getElementById('newZona').value; 
    const c = document.getElementById('newCategoria').value; 
    const d = document.getElementById('newDireccion').value.trim();
    const t = document.getElementById('newTelefono').value.trim();
    document.getElementById('btnAddClient').disabled = !(n && z && c && d && t);
};

window.agregarCliente = function() {
    let venc = document.getElementById('newVencimiento').value;
    if(venc) { let p = venc.split('-'); venc = `${p[2]}/${p[1]}/${p[0]}`; }

    // Generamos el ID de Firestore de antemano para poder mostrarlo visualmente
    const nuevoRef = doc(collection(db, "clientes"));

    const newClient = {
        id: nuevoRef.id,
        id_cliente: nuevoRef.id, // Lo clonamos como dato operativo visible
        cuit_dni: document.getElementById('newCuit').value.trim(), 
        nombre: document.getElementById('newNombre').value.trim().toUpperCase(),
        zona: document.getElementById('newZona').value,
        categoria: document.getElementById('newCategoria').value,
        direccion: document.getElementById('newDireccion').value.trim().toUpperCase(),
        telefono: document.getElementById('newTelefono').value.trim(),
        mail: '',
        p_esp_10: document.getElementById('new_p10').value,
        p_esp_15: document.getElementById('new_p15').value,
        p_esp_45: document.getElementById('new_p45').value,
        p_esp_env_10: document.getElementById('new_e10').value,
        p_esp_env_15: document.getElementById('new_e15').value,
        p_esp_env_45: document.getElementById('new_e45').value,
        vencimiento: venc,
        coordenadas: document.getElementById('newCoordenadas').value.trim(),
        _isNew: true // Marcador para saber que nunca se guardó en Firebase
    };
    
    rows.unshift(newClient);
    buildUI(); 
    window.cerrarModal();
    showToast('⚠️ Cliente agregado a memoria. Recuerda GUARDAR CAMBIOS.', 'info');
};

// ---------------- GUARDAR A FIREBASE CON CHISMOSO ----------------
window.save = async function() {
  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  toggleLoader(true, "GUARDANDO CLIENTES...");
  
  try {
    const batch = writeBatch(db);
    let hayCambios = false;

    rows.forEach(r => {
        // Copiamos el objeto para limpiarlo sin romper el frontend
        const { id, _idx, _original, _isNew, ...cleanData } = r;

        if (_isNew) {
            // Documento completamente nuevo
            const ref = doc(db, "clientes", id);
            batch.set(ref, cleanData);
            hayCambios = true;
            
            // Lo blanqueamos para que deje de ser nuevo si el usuario vuelve a guardar
            r._original = JSON.stringify(cleanData);
            delete r._isNew;
        } else {
            // Ya existía, analizamos con el Chismoso Nivel 2
            const currentString = JSON.stringify(cleanData);
            if (currentString !== _original) {
                const ref = doc(db, "clientes", id);
                batch.update(ref, cleanData);
                hayCambios = true;
                
                // Actualizamos la foto original por si sigue tocando sin refrescar la página
                r._original = currentString; 
            }
        }
    });

    if (!hayCambios) {
        toggleLoader(false);
        showToast("No se detectaron cambios para guardar.", "info");
        btn.disabled = false;
        return;
    }

    await batch.commit();
    localStorage.setItem('vm_clientes_data', JSON.stringify(rows));
    
    toggleLoader(false);
    showToast("¡BASE ACTUALIZADA CON ÉXITO!", "success");
    btn.disabled = false;
  } catch(e){
    console.error(e);
    toggleLoader(false);
    showToast('❌ Error al sincronizar con Firebase', 'error');
    btn.disabled = false;
  }
};
</script>
