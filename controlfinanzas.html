<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Control de Finanzas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<style>
  :root {
    --bg-dark: #050510;
    --accent: #FFD700; 
    --accent-edit: #ff9100;
    --accent-glow: rgba(255, 215, 0, 0.3);
    --text-main: #ffffff;
    --text-sec: #a0a0b0;
    --success-light: #157b38;
    --danger: #ff4757;
    --glass-border: rgba(255, 255, 255, 0.08);
    --card-gradient: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
  }

  body.light-mode {
    --bg-dark: #f0f4f8;
    --text-main: #1a1a24;
    --text-sec: #5a5a6a;
    --glass-border: rgba(0, 0, 0, 0.15);
    --card-gradient: linear-gradient(145deg, #ffffff 0%, #e2e8f0 100%);
    background-image: none !important;
  }

  body.edit-mode { --accent: var(--accent-edit); }
  body.edit-mode .fab-add { background: var(--accent-edit); transform: rotate(45deg); }
  * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; font-family: 'Outfit', sans-serif; color: var(--text-main);
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at 15% 50%, rgba(76, 29, 149, 0.15) 0%, transparent 40%), radial-gradient(circle at 85% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
    background-attachment: fixed; min-height: 100vh; font-size: 13px;
    padding-bottom: 90px; opacity: 0; transition: opacity 0.6s ease, background-color 0.3s;
    color-scheme: dark;
  }
  body.light-mode { color-scheme: light; }

  /* HEADER */
  .fixed-header {
      position: sticky; top: 0; z-index: 200; background: rgba(5, 5, 16, 0.95);
      backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 8px 15px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.3); transition: background 0.3s;
  }
  body.light-mode .fixed-header { background: rgba(255, 255, 255, 0.95); }

  .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin-inline: auto; }
  .page-title { font-size: 1rem; background: linear-gradient(to right, var(--text-main), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin: 0; }
  
  .btn-action { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: var(--text-sec); padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 11px; font-weight: 600; display:flex; align-items:center; justify-content:center; }
  .btn-action:hover { background: rgba(255,255,255,0.1); color: var(--text-main); border-color: var(--text-sec); }
  body.light-mode .btn-action { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }
  body.light-mode .btn-action:hover { background: #e2e8f0; color: #000; }

  .export-wrapper { position: relative; }
  .btn-export { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 11px; }
  .btn-export:hover { background: var(--accent); color: #000; box-shadow: 0 0 10px var(--accent-glow); }
  
  .dropdown-menu { display: none; position: absolute; right: 0; top: 110%; background: #151525; border: 1px solid var(--glass-border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 1000; min-width: 160px; overflow: hidden; }
  .dropdown-menu.show { display: block; }
  .dropdown-item { padding: 10px 12px; color: var(--text-sec); cursor: pointer; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .dropdown-item:hover { background: rgba(255, 215, 0, 0.1); color: var(--accent); }
  body.light-mode .dropdown-menu { background: #ffffff; border-color: #cbd5e1; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
  body.light-mode .dropdown-item { color: #334155; border-bottom-color: #f1f5f9; }
  
  .scroll-content { padding: 15px; max-width: 1000px; margin: 0 auto; }
  
  /* STICKY DASHBOARD */
  .caja-fechas-pegajosa {
    position: sticky; top: 48px; z-index: 100; 
    background-color: rgba(5, 5, 16, 0.95); backdrop-filter: blur(15px);
    padding: 10px 15px; border-bottom: 1px solid var(--glass-border);
    box-shadow: 0 4px 15px rgba(0,0,0,0.6); margin-bottom: 15px; margin-left: -15px; margin-right: -15px; transition: background 0.3s;
  }
  body.light-mode .caja-fechas-pegajosa { background-color: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

  .dashboard { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
  .card { flex: 1; min-width: 110px; background: var(--card-gradient); border: 1px solid var(--glass-border); padding: 6px 10px; border-radius: 8px; text-align: center; }
  .card label { font-size: 9px; color: var(--text-sec); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 2px; font-weight: 600; display: block;}
  .card .value { font-size: 1.1em; font-weight: 800; color: var(--text-main); }
  
  .control-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  
  .filter-panel { display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.02); padding: 4px; border-radius: 8px; border: 1px solid var(--glass-border); flex: 1; min-width: 280px; max-width: 400px; height: 32px; }
  body.light-mode .filter-panel { background: #ffffff; border-color: #cbd5e1; }

  .date-group { position: relative; flex: 1; }
  .date-group input { width: 100%; background: transparent; border: none; color: var(--text-main); padding: 4px 4px 4px 22px; font-family: inherit; font-size: 11px; cursor: pointer; font-weight: 600; height: 100%; }
  .date-group input[type="date"] { min-width: 0; }
  .date-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.55; cursor: pointer; }
  body.light-mode .date-group input[type="date"]::-webkit-calendar-picker-indicator { filter: none; opacity: 0.7; }
  .date-icon { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); color: var(--text-sec); font-size: 10px; }
  .btn-load { background: var(--accent); color: #000; border: none; padding: 0 12px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 10px; transition: 0.2s;}
  .btn-load:active { transform: scale(0.95); }

  .view-controls { display: flex; gap: 2px; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 8px; border: 1px solid var(--glass-border); flex-wrap: wrap; justify-content: center;}
  body.light-mode .view-controls { background: #f1f5f9; border-color: #cbd5e1; }
  
  .btn-view { background: transparent; border: none; color: var(--text-sec); padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.2s;}
  .btn-view.active, .btn-view:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
  body.light-mode .btn-view.active, body.light-mode .btn-view:hover { background: #cbd5e1; color: #000; }
  .divider-view { width: 1px; background: rgba(255,255,255,0.1); margin: 0 4px; }
  body.light-mode .divider-view { background: #cbd5e1; }

  /* TREE VIEW Y COLORES */
  .tree-container { content-visibility: auto; contain-intrinsic-size: 1000px; } 
  
  /* NIVEL 1 */
  details.l1-details { background: #000000; border: 1px solid var(--glass-border); border-left: 3px solid var(--accent); border-radius: 6px; margin-bottom: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); overflow: hidden; }
  details.l1-details > summary { padding: 8px 12px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(255,255,255,0.02);}
  details.l1-details > summary:hover { background: rgba(255,255,255,0.05); }
  .l1-name { font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-main); }
  .sum-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sum-left input[type="checkbox"] { accent-color: var(--accent); }
  .tree-total { font-weight: 800; font-family: monospace; white-space: nowrap; font-size: 12px; }
  .card.active-selection { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }

  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-sec); font-size: 12px; background: rgba(255,255,255,0.02); border: 1px dashed var(--glass-border); border-radius: 10px; }
  .empty-state.error-state { border-color: var(--danger); color: var(--text-main); }
  .empty-state .muted { display: block; margin-top: 6px; color: var(--text-sec); font-size: 11px; font-weight: 500; }
  
  body.light-mode details.l1-details { background: #ffffff; border-color: #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  body.light-mode details.l1-details > summary { background: #f8fafc; }

  /* NIVEL 2 */
  .l2-container { padding: 0; }
  details.l2-details { background: #1a1a1a; border-top: 1px solid rgba(255,255,255,0.05); border-left: 2px solid #555; margin: 0; border-radius: 0; }
  details.l2-details > summary { padding: 6px 12px 6px 30px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  details.l2-details > summary:hover { background: rgba(255,255,255,0.03); }
  .l2-name { color: #e0e0e0; font-weight: 700; text-transform: uppercase;}
  
  body.light-mode details.l2-details { background: #f1f5f9; border-top-color: #e2e8f0; border-left-color: #94a3b8; }
  body.light-mode .l2-name { color: #334155; }
  
  /* NIVEL 3 */
  .table-responsive { background: #f8f9fa; border-top: 1px solid var(--glass-border);}
  body.light-mode .table-responsive { background: #ffffff; border-top-color: #e2e8f0; }
  table { width: 100%; border-collapse: collapse; }
  tr { border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s;} 
  tr:last-child { border-bottom: none; }
  tr:hover { filter: brightness(0.95); }
  
  .row-ingreso { background: rgba(45, 212, 191, 0.15); } 
  .row-egreso { background: rgba(255, 71, 87, 0.1); }   
  body.light-mode .row-ingreso { background: rgba(45, 212, 191, 0.08); } 
  body.light-mode .row-egreso { background: rgba(255, 71, 87, 0.05); } 

  td { padding: 8px 12px; font-size: 12px; color: #111;}
  .col-fecha { color: #555; font-weight: 500; white-space: nowrap;}
  .col-desc { color: #000; font-weight: 600; line-height: 1.3; }
  .col-monto { font-weight: 800; font-family: monospace; text-align: right; white-space: nowrap; font-size: 13px; }
  .table-responsive input[type="checkbox"] { border-color: #aaa; accent-color: var(--accent); transform: scale(1.1);}

  .val-pos { color: var(--success-light) !important; }
  .val-neg { color: var(--danger) !important; }

  /* ORIGEN DE LOS REGISTROS */
  .badge {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: 'Outfit', sans-serif; font-size: 8px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 5px; border-radius: 4px; margin-right: 5px; vertical-align: middle;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge-arqueo { color: #8a5a00; background: rgba(255,215,0,.16); border-color: rgba(255,215,0,.45); }
  body.light-mode .badge-arqueo { color: #7a4a00; background: #fff4cc; border-color: #e0b84d; }
  .badge-impuesto { color: #9a9aa8; background: rgba(160,160,176,.12); border-color: rgba(160,160,176,.3); }
  body.light-mode .badge-impuesto { color: #5a5a6a; background: #f1f5f9; border-color: #cbd5e1; }
  .badge-transferencia { color: #0f766e; background: rgba(45,212,191,.14); border-color: rgba(45,212,191,.4); }
  body.light-mode .badge-transferencia { color: #0f766e; background: #ccfbf1; border-color: #5eead4; }
  .badge-compra { color: #7c3aed; background: rgba(124,58,237,.14); border-color: rgba(124,58,237,.4); }
  body.light-mode .badge-compra { color: #6d28d9; background: #ede9fe; border-color: #c4b5fd; }
  .badge-comision { color: #1d4ed8; background: rgba(96,165,250,.14); border-color: rgba(96,165,250,.4); }
  body.light-mode .badge-comision { color: #1e40af; background: #dbeafe; border-color: #93c5fd; }
  .badge-link { cursor: pointer; font-family: inherit; }
  .badge-link:hover { filter: brightness(1.2); }
  .hidden { display: none !important; }
  tr.row-highlight { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* CONCILIACIÓN DE ARQUEOS */
  #arqueo-view { margin-top: 4px; }
  .arqueo-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .arqueo-kpi { background: var(--card-gradient); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px 12px; }
  .arqueo-kpi .k { display:block; font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-sec); font-weight: 700; margin-bottom: 4px; }
  .arqueo-kpi .v { display:block; font-size: 15px; font-weight: 800; font-family: monospace; }
  .arqueo-kpi .s { display:block; margin-top: 3px; font-size: 9px; color: var(--text-sec); }
  .arqueo-head { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .arqueo-title { font-size: 15px; font-weight: 800; color: var(--accent); letter-spacing: .02em; }
  .arqueo-sub { margin-top: 3px; font-size: 10px; color: var(--text-sec); }
  .arqueo-head-actions { display:flex; gap:6px; flex-wrap:wrap; }
  .arqueo-meta { margin-top: 2px; font-size: 9px; color: var(--text-sec); }
  .arqueo-modal-label { margin: 12px 0 5px; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-sec); font-weight: 800; }
  .arqueo-movs { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; max-height:110px; overflow:auto; }
  .arqueo-movs span { font-family: monospace; font-size: 9px; color: var(--text-sec); border:1px solid var(--glass-border); border-radius:4px; padding:2px 5px; }
  .arqueo-warning { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; border: 1px solid rgba(255,145,0,.45); background: rgba(255,145,0,.08); color: var(--accent-edit); }
  .arqueo-table-wrap { overflow-x: auto; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255,255,255,.02); }
  body.light-mode .arqueo-table-wrap { background: #fff; border-color: #cbd5e1; }
  table.arqueo-table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 760px; }
  .arqueo-table thead th { background: rgba(0,0,0,.35); color: var(--text-sec); font-size: 9px; letter-spacing: .05em; text-transform: uppercase; padding: 8px 9px; text-align: left; white-space: nowrap; }
  body.light-mode .arqueo-table thead th { background: #f1f5f9; color: #334155; }
  .arqueo-table tbody td { padding: 8px 9px; border-bottom: 1px solid rgba(255,255,255,.05); vertical-align: middle; color: var(--text-main); }
  body.light-mode .arqueo-table tbody td { border-bottom-color: #e2e8f0; }
  .arqueo-table tbody tr:hover { background: rgba(255,215,0,.05); }
  .arqueo-table .num { text-align: right; white-space: nowrap; font-family: monospace; }
  .arqueo-table .cierre-id { font-family: monospace; font-size: 9px; color: var(--text-sec); }
  .status-pill { display:inline-block; font-size: 8px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .status-ok { color: #0f766e; background: rgba(45,212,191,.12); border-color: rgba(45,212,191,.45); }
  body.light-mode .status-ok { color: #0b5f58; background: #ccfbf1; border-color: #5eead4; }
  .status-dif { color: #b45309; background: rgba(255,145,0,.12); border-color: rgba(255,145,0,.45); }
  body.light-mode .status-dif { color: #92400e; background: #fef3c7; border-color: #fbbf24; }
  .status-missing { color: #b91c1c; background: rgba(255,71,87,.12); border-color: rgba(255,71,87,.45); }
  body.light-mode .status-missing { color: #991b1b; background: #fee2e2; border-color: #fca5a5; }
  .status-nodetail { color: #6b7280; background: rgba(107,114,128,.12); border-color: rgba(107,114,128,.35); }
  body.light-mode .status-nodetail { color: #475569; background: #f1f5f9; border-color: #cbd5e1; }
  .arqueo-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .btn-micro { background: rgba(255,255,255,.06); border: 1px solid var(--glass-border); color: var(--text-sec); border-radius: 4px; padding: 3px 7px; font-size: 9px; font-weight: 700; cursor: pointer; white-space: nowrap; display:inline-flex; align-items:center; text-decoration:none; }
  .btn-micro:hover { border-color: var(--accent); color: var(--accent); }
  body.light-mode .btn-micro { background: #f8fafc; border-color: #cbd5e1; color: #334155; }
  .arqueo-detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
  .arqueo-detail-grid .item { background: rgba(255,255,255,.03); border: 1px solid var(--glass-border); border-radius: 6px; padding: 8px 10px; }
  body.light-mode .arqueo-detail-grid .item { background: #f8fafc; border-color: #cbd5e1; }
  .arqueo-detail-grid .item .k { display:block; font-size: 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-sec); font-weight: 700; margin-bottom: 3px; }
  .arqueo-detail-grid .item .v { display:block; font-size: 12px; font-weight: 800; }
  .arqueo-detail-days { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
  .arqueo-detail-days th, .arqueo-detail-days td { padding: 5px 6px; border-bottom: 1px solid var(--glass-border); text-align: left; }
  .arqueo-detail-days th { color: var(--text-sec); font-size: 8px; text-transform: uppercase; }
  .arqueo-detail-days td.num { text-align: right; font-family: monospace; }
  .arqueo-detail-obs { margin-top: 10px; padding: 9px 11px; border-left: 3px solid var(--accent); background: rgba(255,215,0,.06); font-size: 10px; line-height: 1.5; }
  .arqueo-modal-content { max-width: 760px; text-align: left; }
  .arqueo-modal-content h3 { font-size: 15px; margin: 0 0 4px; color: var(--accent); }
  .arqueo-modal-content .sub { color: var(--text-sec); font-size: 10px; margin-bottom: 8px; }

  /* FAB & MODALS */
  .fab-add { width: 45px; height: 45px; font-size: 24px; bottom: 20px; right: 20px; background: var(--accent); color: #000; border-radius: 50%; display: grid; place-items: center; position: fixed; box-shadow: 0 4px 15px var(--accent-glow); cursor: pointer; z-index: 200; transition: 0.3s; border: none; }
  #modal, #pinModal, #arqueoModal { backdrop-filter: blur(15px); background: rgba(0,0,0,0.6); display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300; align-items: center; justify-content: center; }
  .modal-content { background: rgba(10, 10, 20, 0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px; width: 90%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center; border-top: 4px solid var(--accent); max-height: 90vh; overflow-y: auto;}
  body.light-mode .modal-content { background: #ffffff; border-color: #cbd5e1; }

  .form-control { width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 12px; transition: 0.3s; font-weight: 600;}
  .form-control:focus { border-color: var(--accent); background: rgba(255,215,0,0.05);}
  .form-control[readonly] { opacity: 0.7; cursor: not-allowed; }
  body.light-mode .form-control { background: #f1f5f9; color: #000; border-color: #cbd5e1; }

  .btn-save { width: 100%; background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; margin-top: 5px; transition: 0.3s; }
  .btn-save:hover { box-shadow: 0 0 15px var(--accent-glow); }
  .btn-cancel { width: 100%; background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); padding: 10px; margin-top: 10px; cursor: pointer; border-radius: 8px; font-weight: 600;}
  body.light-mode .btn-cancel { border-color: #cbd5e1; color: #334155; }
  
  .btn-delete { width: 100%; background: rgba(255, 71, 87, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; margin-top: 15px; cursor: pointer; border-radius: 8px; font-weight: 700; display: none; }
  .pin-wrapper { display: none; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
  body.light-mode .pin-wrapper { border-top-color: #cbd5e1; }
  .audit-diff { font-size: 12px; font-weight: 800; margin-top: -5px; margin-bottom: 10px; display: none; }

  <script type="module">
// ============================================================
// CONTROL FINANZAS - VMGAS2 (Firestore directo)
// Colección principal: confinanzas
//   { id, fecha:"YYYY-MM-DD", rubro, subrubro, detalle, monto,
//     usuario, tipo:"INGRESO"|"EGRESO", origen, pagos, timestamp }
// Seguridad: seguridad/pin (dinamico | maestro), historialPin,
//            auditoria, alarmas.
// ============================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import {
    getFirestore, doc, getDoc, getDocs, collection, query, where,
    writeBatch, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCesmFFsn7LvgmcFMWFfi6F5_Zvco79ucM",
    authDomain: "vmgaslr.firebaseapp.com",
    projectId: "vmgaslr",
    storageBucket: "vmgaslr.firebasestorage.app",
    messagingSenderId: "75859850089",
    appId: "1:75859850089:web:fc551c770bbf4ae25803f8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TIMEOUT_SESION = 14400000; // 4 horas
const TAX_TRANSFERENCIA = 0.006; // Ley 25413
const MAX_BATCH = 450;

const $ = (id) => document.getElementById(id);
const pad2 = (n) => String(n).padStart(2, '0');

function num(v) {
    if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
    if (v === null || v === undefined || v === '') return 0;

    let s = String(v).trim().replace(/\s/g, '').replace(/[^\d,.\-]/g, '');
    if (!s) return 0;

    const lastComma = s.lastIndexOf(',');
    const lastDot = s.lastIndexOf('.');
    if (lastComma > -1 && lastDot > -1) {
        s = lastComma > lastDot
            ? s.replace(/\./g, '').replace(',', '.')
            : s.replace(/,/g, '');
    } else if (lastComma > -1) {
        s = s.replace(',', '.');
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
}

const round2 = (n) => Math.round(num(n) * 100) / 100;

function fmtMoney(n) {
    return Math.abs(num(n)).toLocaleString('es-AR', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

function fmtTri(n) {
    const v = num(n);
    return `${v >= 0 ? '▲' : '▼'} $ ${fmtMoney(v)}`;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const escAttr = (s) => esc(s).replace(/`/g, '&#96;');

function isoFromDate(d) {
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

const todayISO = () => isoFromDate(new Date());

function normFecha(v) {
    if (!v) return '';

    if (v instanceof Date) return isoFromDate(v);

    if (typeof v === 'object') {
        if (typeof v.toDate === 'function') return isoFromDate(v.toDate());
        if (typeof v.seconds === 'number') return isoFromDate(new Date(v.seconds * 1000));
    }

    const s = String(v).trim();
    if (!s) return '';

    let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;

    m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;

    const d = new Date(s);
    return Number.isNaN(d.getTime()) ? '' : isoFromDate(d);
}

function fechaVisual(iso) {
    if (!iso) return '—';
    const p = iso.split('-');
    return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
}

function fechaMs(iso) {
    if (!iso) return 0;
    const p = iso.split('-').map(Number);
    if (p.length !== 3) return 0;
    return new Date(p[0], p[1] - 1, p[2]).getTime();
}

function fechaDeDoc(d) {
    const f = normFecha(d.fecha ?? d.FECHA ?? d.fecha_hora ?? d.timestamp ?? d.TIMESTAMP ?? d.creado);
    if (f) return f;

    const ts = d.timestampMs ?? d.TIMESTAMP_MS ?? d.creadoMs;
    if (typeof ts === 'number' && ts > 0) return isoFromDate(new Date(ts));
    return '';
}

function ordenDeDoc(d, fecha) {
    const ts = d.timestampMs ?? d.TIMESTAMP_MS ?? d.creadoMs;
    if (typeof ts === 'number' && ts > 0) return ts;
    if (d.timestamp && typeof d.timestamp.toDate === 'function') return d.timestamp.toDate().getTime();
    return fechaMs(fecha);
}

// ---------------- UI base ----------------
function showToast(msg, type = 'info', ms = 4000) {
    const c = $('toast-container');
    if (!c) return;
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
    }, ms);
}

function toggleLoader(show, text = 'CARGANDO...') {
    const o = $('loadingOverlay');
    if (!o) return;
    const t = $('loaderText');
    if (t) t.textContent = text;
    o.classList.toggle('active', !!show);
}

function setBtn(btn, busy, busyText, normalText) {
    if (!btn) return;
    btn.disabled = !!busy;
    btn.textContent = busy ? busyText : normalText;
}

// ---------------- Sesión ----------------
const params = new URLSearchParams(window.location.search);
const k = params.get('k') || params.get('token') || sessionStorage.getItem('k') || sessionStorage.getItem('vm_token');
const deepArqueo = String(params.get('arqueo') || params.get('idCierre') || '').trim();

function expulsar() {
    sessionStorage.clear();
    window.location.replace('index.html');
}

window.volver = () => window.location.replace(`inicio.html?k=${encodeURIComponent(k || '')}`);

if (!k) {
    expulsar();
} else {
    sessionStorage.setItem('k', k);
    sessionStorage.setItem('vm_token', k);
    if (window.history.replaceState) window.history.replaceState({}, document.title, window.location.pathname);
    validarSesion();
}

let tIdle;
function resetTimer() {
    clearTimeout(tIdle);
    tIdle = setTimeout(() => {
        showToast('⏱️ Sesión expirada por inactividad.', 'info');
        setTimeout(expulsar, 1200);
    }, TIMEOUT_SESION);
}
['click', 'mousemove', 'keydown', 'touchstart', 'scroll'].forEach(evt =>
    document.addEventListener(evt, resetTimer, { passive: true })
);
resetTimer();

function expiraMs(v) {
    return toMs(v);
}

function toMs(v) {
    if (!v) return 0;
    if (v instanceof Date) return v.getTime();
    if (typeof v === 'number') return v;
    if (typeof v.toDate === 'function') return v.toDate().getTime();
    if (typeof v.seconds === 'number') return v.seconds * 1000;
    if (typeof v === 'string') {
        const n = Number(v);
        if (Number.isFinite(n) && n > 0) return n;
        const d = new Date(v);
        return Number.isNaN(d.getTime()) ? 0 : d.getTime();
    }
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
}

let usuarioActivo = 'SISTEMA';
let permisosUsuario = { CONFINANZAS: false, FINANZAS: false, USUARIOS: false };

function permisoActivo(nombre) {
    return permisosUsuario[String(nombre || '').toUpperCase()] === true;
}

async function validarSesion() {
    try {
        document.body.style.opacity = 1;
        toggleLoader(true, 'VERIFICANDO SESIÓN...');

        const snap = await getDoc(doc(db, 'tokens', k));
        if (!snap.exists()) throw new Error('Sesión inválida en base de datos.');

        const data = snap.data();
        const exp = expiraMs(data.expira);
        if (exp && Date.now() > exp) throw new Error('La sesión ha expirado.');

        usuarioActivo = data.usuario || data.nombre_mostrar || 'SISTEMA';
        sessionStorage.setItem('usuarioActivo', usuarioActivo);

        // El tile de inicio se muestra con CONFINANZAS; validamos lo mismo acá
        // para que un acceso directo por URL no saltee el permiso.
        if (data.usuario) {
            const userSnap = await getDoc(doc(db, 'usuarios', data.usuario));
            if (!userSnap.exists()) throw new Error('Usuario no encontrado.');

            const u = userSnap.data();
            permisosUsuario = {
                CONFINANZAS: u.CONFINANZAS === true || u.CONFINANZAS === 'true',
                FINANZAS: u.FINANZAS === true || u.FINANZAS === 'true',
                USUARIOS: u.USUARIOS === true || u.USUARIOS === 'true'
            };

            if (!permisosUsuario.CONFINANZAS) {
                showToast('⛔ No tenés permiso para Control de Finanzas.', 'error');
                setTimeout(expulsar, 1800);
                return;
            }
        }

        await iniciarApp();
    } catch (e) {
        console.error(e);
        expulsar();
    } finally {
        toggleLoader(false);
    }
}

// ---------------- Estado ----------------
let allRows = [];
let treeData = {};
let currentSummary = { ingresos: 0, gastos: 0, total: 0 };
let globalOptions = {};
let currentView = 'L1';
let currentEditMode = false;
let deleteRequested = false;
let currentEditId = '';
let payIndex = 0;

let allArqueos = [];
let arqueosPorCierre = new Map();
let arqueosOrphans = [];
let arqueosError = null;

// ---------------- Arranque ----------------
async function iniciarApp() {
    const hoy = new Date();
    const dow = hoy.getDay();
    const start = new Date(hoy);
    if (dow === 1) start.setDate(hoy.getDate() - 7);
    else {
        const offset = dow === 0 ? 6 : dow - 1;
        start.setDate(hoy.getDate() - offset);
    }

    $('filter-start-fin').value = isoFromDate(start);
    $('filter-end-fin').value = isoFromDate(hoy);

    wireUI();
    await cargarDatos();

    if (deepArqueo) {
        ampliarFiltroParaArqueo(deepArqueo);
        aplicarFiltro();
        setTreeView('ARQ');
        setTimeout(() => {
            window.openArqueoModal(deepArqueo);
            const fila = [...document.querySelectorAll('tr[data-cierre]')]
                .find(tr => tr.dataset.cierre === deepArqueo);
            if (fila) {
                fila.classList.add('row-highlight');
                fila.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }, 80);
    }
}

// ---------------- Carga y normalización ----------------
function esDeArqueo(raw) {
    return String((raw && (raw.origen ?? raw.ORIGEN)) || '').trim().toUpperCase() === 'ARQUEO';
}

function esDeImpuesto(raw) {
    return String((raw && (raw.origen ?? raw.ORIGEN)) || '').trim().toUpperCase() === 'IMPUESTO';
}

function esDeTransferencia(raw) {
    return String((raw && (raw.origen ?? raw.ORIGEN)) || '').trim().toUpperCase() === 'TRANSFERENCIA';
}

function esDeCompra(raw) {
    return String((raw && (raw.origen ?? raw.ORIGEN)) || '').trim().toUpperCase() === 'COMPRA';
}

function esDeComision(raw) {
    return String((raw && (raw.origen ?? raw.ORIGEN)) || '').trim().toUpperCase() === 'COMISION';
}

function esAutomatico(raw) {
    return esDeImpuesto(raw) || esDeTransferencia(raw) || esDeCompra(raw) || esDeComision(raw);
}

function avisoAutomatico(raw) {
    if (esDeTransferencia(raw)) {
        return '⛔ Los asientos de transferencias se administran desde Control de Transferencias y no se pueden editar ni eliminar acá.';
    }
    if (esDeCompra(raw)) {
        return '⛔ Los asientos de compras se administran desde Control de Remitos y no se pueden editar ni eliminar acá.';
    }
    if (esDeComision(raw)) {
        return '⛔ Los pagos de comisiones se administran desde Control de Comisiones y no se pueden editar ni eliminar acá.';
    }
    return '⛔ Los registros de impuesto son automáticos y no se pueden editar ni eliminar.';
}

function normalizarDoc(id, d) {
    const fecha = fechaDeDoc(d);
    if (!fecha) return null;

    const montoRaw = num(d.monto ?? d.MONTO ?? 0);
    const tipoRaw = String(d.tipo ?? d.TIPO ?? '').trim().toUpperCase();
    const esEgreso = tipoRaw === 'EGRESO' || (!tipoRaw && montoRaw < 0);

    const rubro = String(d.rubro ?? d.RUBRO ?? d.concepto ?? d.concepto_principal ?? 'VARIOS').trim() || 'VARIOS';
    const subrubro = String(d.subrubro ?? d.SUBRUBRO ?? d.categoria ?? 'General').trim() || 'General';
    const detalle = String(d.detalle ?? d.DETALLE ?? d.descripcion ?? '').trim();

    const arqueoId = String(d.idCierre ?? d.ID_CIERRE ?? d.IDCIERRE ?? '').trim();
    const origenRaw = String(d.origen ?? d.ORIGEN ?? '').trim().toUpperCase();
    const origen = origenRaw || (arqueoId ? 'ARQUEO' : 'MANUAL');
    const referencia = String(
        d.referencia ?? d.REFERENCIA ?? d.idCierre ?? d.ID_CIERRE ?? d.IDCIERRE ?? ''
    ).trim();

    return {
        id,
        fecha,
        rubro,
        subrubro,
        detalle,
        monto: esEgreso ? -Math.abs(montoRaw) : Math.abs(montoRaw),
        tipo: esEgreso ? 'EGRESO' : 'INGRESO',
        origen,
        referencia,
        arqueoId,
        pagos: d.pagos ?? d.PAGOS ?? null,
        orden: ordenDeDoc(d, fecha),
        raw: d
    };
}

function normalizarArqueo(id, d) {
    const fechaISO = normFecha(d.fecha ?? d.FECHA);
    if (!fechaISO) return null;

    const idCierre = String(d.idCierre ?? d.ID_CIERRE ?? d.IDCIERRE ?? id ?? '').trim() || id;
    const sisEfectivo = round2(num(d.sisEfectivo ?? d.SIS_EFECTIVO ?? d.sis_efectivo ?? 0));
    const sisGastos = round2(num(d.sisGastos ?? d.SIS_GASTOS ?? d.sis_gastos ?? 0));
    const sisTotalRaw = d.sisTotal ?? d.SIS_TOTAL ?? d.sis_total;
    const sisTotal = round2(sisTotalRaw != null ? num(sisTotalRaw) : (sisEfectivo - sisGastos));
    const realEfectivo = round2(num(d.realEfectivo ?? d.REAL_EFECTIVO ?? d.real_efectivo ?? 0));
    const difRaw = d.diferencia ?? d.DIFERENCIA;
    const diferencia = round2(difRaw != null ? num(difRaw) : (realEfectivo - sisTotal));

    const movsRaw = Array.isArray(d.movimientos) ? d.movimientos
        : Array.isArray(d.MOVIMIENTOS) ? d.MOVIMIENTOS : [];
    const movs = movsRaw.map(x => String(x)).filter(Boolean);

    const gastosRaw = Array.isArray(d.gastosDetalle) ? d.gastosDetalle
        : Array.isArray(d.GASTOS_DETALLE) ? d.GASTOS_DETALLE : [];
    const gastosDetalle = gastosRaw.map(g => ({
        motivo: String(g?.motivo ?? g?.MOTIVO ?? g ?? '').trim(),
        monto: round2(num(g?.monto ?? g?.MONTO ?? 0))
    })).filter(g => g.motivo || g.monto > 0);

    const cantidadRaw = d.cantidadMovimientos ?? d.CANTIDAD_MOVIMIENTOS ?? d.cant_movimientos;
    const cantidadMovimientos = Number.isFinite(Number(cantidadRaw)) && Number(cantidadRaw) >= 0
        ? Number(cantidadRaw)
        : movs.length;

    return {
        id,
        idCierre,
        fecha: fechaISO,
        hora: String(d.hora ?? d.HORA ?? '').trim(),
        chofer: String(d.chofer ?? d.CHOFER ?? d.usuarioChofer ?? '').trim(),
        choferUsuario: String(d.choferUsuario ?? d.CHOFER_USUARIO ?? '').trim(),
        auditor: String(d.auditor ?? d.AUDITOR ?? '').trim(),
        sisEfectivo,
        sisTransf: round2(num(d.sisTransf ?? d.SIS_TRANSF ?? d.sis_transf ?? 0)),
        sisGastos,
        sisTotal,
        realEfectivo,
        realTransf: round2(num(d.realTransf ?? d.REAL_TRANSF ?? d.real_transf ?? 0)),
        diferencia,
        observaciones: String(d.observaciones ?? d.OBSERVACIONES ?? d.obs ?? '').trim(),
        cantidadMovimientos,
        movimientos: movs,
        gastosDetalle,
        origen: String(d.origen ?? d.ORIGEN ?? 'ARQUEO').trim().toUpperCase() || 'ARQUEO',
        orden: toMs(d.creado ?? d.CREADO) || toMs(d.timestampMs ?? d.TIMESTAMPMS) || fechaMs(fechaISO),
        raw: d
    };
}

function esFinDeArqueo(r) {
    return r.origen === 'ARQUEO' || !!r.arqueoId || /^ARQ-/i.test(String(r.referencia || ''));
}

function unicos(valores) {
    return [...new Set(valores.map(v => String(v ?? '').trim()).filter(Boolean))];
}

function finalizarGrupoArqueo(g) {
    g.dias.sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));
    g.fechas = [...new Set(g.dias.map(d => d.fecha))].sort();
    g.fechaMin = g.fechas[0] || '';
    g.fechaMax = g.fechas[g.fechas.length - 1] || '';
    g.realTotal = round2(g.dias.reduce((a, d) => a + d.realEfectivo, 0));
    g.sisEfectivo = round2(g.dias.reduce((a, d) => a + d.sisEfectivo, 0));
    g.sisTransf = round2(g.dias.reduce((a, d) => a + d.sisTransf, 0));
    g.sisGastos = round2(g.dias.reduce((a, d) => a + d.sisGastos, 0));
    g.sisTotal = round2(g.dias.reduce((a, d) => a + d.sisTotal, 0));
    g.difCaja = round2(g.dias.reduce((a, d) => a + d.diferencia, 0));
    g.movsCount = g.dias.reduce((a, d) => a + (d.cantidadMovimientos || d.movimientos.length || 0), 0);
    g.chofer = unicos(g.dias.map(d => d.chofer)).join(' / ') || '—';
    g.choferUsuario = unicos(g.dias.map(d => d.choferUsuario)).join(' / ');
    g.auditor = unicos(g.dias.map(d => d.auditor)).join(' / ') || '—';
    g.hora = unicos(g.dias.map(d => d.hora)).join(' / ');
    g.observaciones = unicos(g.dias.map(d => d.observaciones)).join(' | ');
    g.gastosDetalle = g.dias.flatMap(d => d.gastosDetalle.map(x => ({ ...x, fecha: d.fecha })));
    g.orden = Math.max(...g.dias.map(d => d.orden || 0), 0);
    g.fin = null;
    g.finMonto = 0;
    g.conciliacion = null;
    g.estado = 'SIN_FINANZAS';
    return g;
}

function reconstruirArqueos() {
    const grupos = new Map();

    allArqueos.forEach(a => {
        let g = grupos.get(a.idCierre);
        if (!g) {
            g = { idCierre: a.idCierre, dias: [] };
            grupos.set(a.idCierre, g);
        }
        g.dias.push(a);
    });

    const lista = [...grupos.values()].map(finalizarGrupoArqueo);

    const finMap = new Map();
    allRows.forEach(r => {
        const claves = new Set([r.id]);
        if (esFinDeArqueo(r)) {
            if (r.arqueoId) claves.add(r.arqueoId);
            if (r.referencia) claves.add(r.referencia);
        }
        claves.forEach(c => {
            if (c && !finMap.has(c)) finMap.set(c, r);
        });
    });

    const usados = new Set();

    lista.forEach(g => {
        g.fin = finMap.get(g.idCierre) || null;
        if (g.fin) {
            usados.add(g.fin.id);
            g.finMonto = Math.abs(num(g.fin.monto));
            g.conciliacion = round2(g.finMonto - g.realTotal);
            g.estado = Math.abs(g.conciliacion) > 0.01 ? 'DIF' : 'OK';
        } else {
            g.finMonto = 0;
            g.conciliacion = null;
            g.estado = 'SIN_FINANZAS';
        }
    });

    arqueosPorCierre = new Map(lista.map(g => [g.idCierre, g]));

    arqueosOrphans = allRows
        .filter(r => esFinDeArqueo(r) && !usados.has(r.id))
        .map(r => ({
            idCierre: r.id,
            esSinDetalle: true,
            fin: r,
            finMonto: Math.abs(num(r.monto)),
            realTotal: 0,
            conciliacion: null,
            difCaja: 0,
            fechas: [r.fecha],
            fechaMin: r.fecha,
            fechaMax: r.fecha,
            chofer: String(r.raw?.chofer ?? r.raw?.CHOFER ?? '').trim() || '—',
            choferUsuario: '',
            auditor: String(r.raw?.usuario ?? r.raw?.USUARIO ?? '').trim() || '—',
            hora: String(r.raw?.hora ?? r.raw?.HORA ?? '').trim(),
            dias: [],
            movsCount: 0,
            sisEfectivo: 0,
            sisTransf: 0,
            sisGastos: 0,
            sisTotal: 0,
            observaciones: '',
            gastosDetalle: [],
            estado: 'SIN_DETALLE',
            orden: r.orden || fechaMs(r.fecha),
            raw: r.raw
        }))
        .sort((a, b) => (b.orden || 0) - (a.orden || 0));
}

async function cargarDatos() {
    toggleLoader(true, 'LEYENDO FINANZAS...');
    $('tree-root').innerHTML = '<div class="empty-state">Actualizando balance...</div>';
    arqueosError = null;

    try {
        const [finRes, arqRes] = await Promise.allSettled([
            getDocs(collection(db, 'confinanzas')),
            getDocs(collection(db, 'arqueos'))
        ]);

        if (finRes.status === 'rejected') throw finRes.reason;

        allRows = [];
        finRes.value.forEach(d => {
            const r = normalizarDoc(d.id, d.data());
            if (r) allRows.push(r);
        });

        if (arqRes.status === 'fulfilled') {
            allArqueos = [];
            arqRes.value.forEach(d => {
                const r = normalizarArqueo(d.id, d.data());
                if (r) allArqueos.push(r);
            });
        } else {
            console.error(arqRes.reason);
            allArqueos = [];
            arqueosError = arqRes.reason;
        }

        reconstruirArqueos();
        aplicarFiltro();
    } catch (e) {
        console.error(e);
        allRows = [];
        allArqueos = [];
        arqueosPorCierre = new Map();
        arqueosOrphans = [];
        $('tree-root').innerHTML = `<div class="empty-state error-state">
            No se pudo leer <b>confinanzas</b>.<br>
            <span class="muted">${esc(e.code || e.message || 'Error de conexión')}</span><br>
            <span class="muted">Revisá las reglas de Firestore para esta colección.</span>
        </div>`;
        showToast('Error leyendo confinanzas: ' + (e.code || e.message || 'conexión'), 'error');
    } finally {
        toggleLoader(false);
    }
}
window.cargarDatos = cargarDatos;

function aplicarFiltro() {
    let start = $('filter-start-fin').value;
    let end = $('filter-end-fin').value;

    if (start && end && start > end) {
        [start, end] = [end, start];
        $('filter-start-fin').value = start;
        $('filter-end-fin').value = end;
    }

    const rows = allRows.filter(r => {
        if (start && r.fecha < start) return false;
        if (end && r.fecha > end) return false;
        return true;
    });

    treeData = construirArbol(rows);
    currentSummary = resumir(rows);
    globalOptions = construirOpciones(allRows);

    updateDashboardValues(currentSummary.ingresos, currentSummary.gastos, currentSummary.total, false);
    renderTree(treeData);
    setupDatalists(globalOptions);
    setTreeView(currentView);
}

function resumir(rows) {
    let ingresos = 0;
    let gastos = 0;

    rows.forEach(r => {
        if (r.monto >= 0) ingresos += r.monto;
        else gastos += r.monto;
    });

    return { ingresos, gastos, total: ingresos + gastos };
}

function construirArbol(rows) {
    const tree = {};

    rows.forEach(r => {
        if (!tree[r.rubro]) tree[r.rubro] = { total: 0, subs: {} };
        tree[r.rubro].total += r.monto;

        if (!tree[r.rubro].subs[r.subrubro]) {
            tree[r.rubro].subs[r.subrubro] = { total: 0, items: [] };
        }

        const sub = tree[r.rubro].subs[r.subrubro];
        sub.total += r.monto;
        sub.items.push(r);
    });

    const ordenados = {};
    Object.keys(tree).sort((a, b) => a.localeCompare(b, 'es')).forEach(l1 => {
        const g1 = tree[l1];
        const subs = {};
        Object.keys(g1.subs).sort((a, b) => a.localeCompare(b, 'es')).forEach(l2 => {
            const g2 = g1.subs[l2];
            g2.items.sort((a, b) => {
                const f = String(b.fecha).localeCompare(String(a.fecha));
                return f !== 0 ? f : (b.orden - a.orden);
            });
            subs[l2] = g2;
        });
        ordenados[l1] = { total: g1.total, subs };
    });

    return ordenados;
}

function construirOpciones(rows) {
    const map = {};
    rows.forEach(r => {
        if (!map[r.rubro]) map[r.rubro] = new Set();
        map[r.rubro].add(r.subrubro);
    });

    const out = {};
    Object.keys(map).sort((a, b) => a.localeCompare(b, 'es')).forEach(l1 => {
        out[l1] = [...map[l1]].sort((a, b) => a.localeCompare(b, 'es'));
    });
    return out;
}

// ---------------- Árbol ----------------
function renderTree(tree) {
    const root = $('tree-root');
    const l1Keys = Object.keys(tree);

    if (!l1Keys.length) {
        root.innerHTML = '<div class="empty-state">Sin registros en el período seleccionado.</div>';
        return;
    }

    let html = '';

    l1Keys.forEach(l1 => {
        const g1 = tree[l1];
        html += `<details class="l1-details">
            <summary>
                <div class="sum-left">
                    <input type="checkbox" class="parent-check" data-level="l1" aria-label="Seleccionar ${escAttr(l1)}">
                    <span class="l1-name">${esc(l1)}</span>
                </div>
                <span class="tree-total ${g1.total >= 0 ? 'val-pos' : 'val-neg'}" data-original="${g1.total}">${fmtTri(g1.total)}</span>
            </summary>`;

        Object.keys(g1.subs).forEach(l2 => {
            const g2 = g1.subs[l2];

            html += `<div class="l2-container"><details class="l2-details">
                <summary>
                    <div class="sum-left">
                        <input type="checkbox" class="parent-check" data-level="l2" aria-label="Seleccionar ${escAttr(l2)}">
                        <span class="l2-name">${esc(l2)}</span>
                    </div>
                    <span class="tree-total ${g2.total >= 0 ? 'val-pos' : 'val-neg'}" data-original="${g2.total}">${fmtTri(g2.total)}</span>
                </summary>
                <div class="table-responsive"><table><tbody>`;

            g2.items.forEach(r => {
                const esEgreso = r.monto < 0;
                const rowClass = esEgreso ? 'row-egreso' : 'row-ingreso';
                const colorClass = esEgreso ? 'val-neg' : 'val-pos';
                const icon = esEgreso ? '▼' : '▲';

                let badge = '';
                if (r.origen === 'ARQUEO' || r.arqueoId) {
                    const arqId = r.arqueoId || r.referencia || r.id;
                    badge = `<button type="button" class="badge badge-arqueo badge-link" data-arqueo="${escAttr(arqId)}" title="Ver arqueo ${escAttr(arqId)}">ARQUEO</button>`;
                } else if (r.origen === 'IMPUESTO') {
                    badge = `<span class="badge badge-impuesto" title="Impuesto automático${r.referencia ? ` de ${escAttr(r.referencia)}` : ''}">IMPUESTO</span>`;
                } else if (r.origen === 'TRANSFERENCIA') {
                    badge = `<span class="badge badge-transferencia" title="Acreditado desde Control de Transferencias${r.referencia ? ` · ${escAttr(r.referencia)}` : ''}">TRANSFERENCIA</span>`;
                } else if (r.origen === 'COMPRA') {
                    badge = `<span class="badge badge-compra" title="Registrado desde Control de Remitos${r.referencia ? ` · ${escAttr(r.referencia)}` : ''}">COMPRA</span>`;
                } else if (r.origen === 'COMISION') {
                    badge = `<span class="badge badge-comision" title="Pagado desde Control de Comisiones${r.referencia ? ` · ${escAttr(r.referencia)}` : ''}">COMISIÓN</span>`;
                }

                html += `<tr class="${rowClass}" data-id="${escAttr(r.id)}">
                    <td width="30" style="text-align:center">
                        <input type="checkbox" class="item-check" value="${r.monto}" aria-label="Seleccionar registro">
                    </td>
                    <td width="76" class="col-fecha">${esc(fechaVisual(r.fecha))}</td>
                    <td class="col-desc">${badge}${esc(r.detalle || '—')}</td>
                    <td class="col-monto ${colorClass}">${icon} $ ${fmtMoney(r.monto)}</td>
                </tr>`;
            });

            html += `</tbody></table></div></details></div>`;
        });

        html += `</details>`;
    });

    root.innerHTML = html;
    wireTree();
}

function wireTree() {
    const root = $('tree-root');

    root.querySelectorAll('.parent-check').forEach(chk => {
        chk.addEventListener('change', () => window.toggleChildren(chk));
    });

    root.querySelectorAll('.item-check').forEach(chk => {
        chk.addEventListener('change', () => window.calcSelection());
    });

    root.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.addEventListener('dblclick', () => window.openModal('edit', tr.dataset.id));
    });

    root.querySelectorAll('button[data-arqueo]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.openArqueoModal(btn.dataset.arqueo);
        });
        btn.addEventListener('dblclick', (e) => e.stopPropagation());
    });
}

function paintTotal(span, value) {
    if (!span) return;
    span.classList.remove('val-pos', 'val-neg');
    span.classList.add(value >= 0 ? 'val-pos' : 'val-neg');
    span.textContent = fmtTri(value);
}

window.setTreeView = function (mode) {
    currentView = mode || 'L1';

    document.querySelectorAll('.btn-view[data-view]').forEach(b => {
        b.classList.toggle('active', b.dataset.view === currentView);
    });

    if (currentView === 'ARQ') {
        $('tree-root').classList.add('hidden');
        $('arqueo-view').classList.remove('hidden');
        renderArqueos();
        return;
    }

    $('tree-root').classList.remove('hidden');
    $('arqueo-view').classList.add('hidden');

    const l1Details = document.querySelectorAll('.l1-details');
    const l2Details = document.querySelectorAll('.l2-details');

    if (currentView === 'L1') {
        l1Details.forEach(d => d.removeAttribute('open'));
        l2Details.forEach(d => d.removeAttribute('open'));
    } else if (currentView === 'L2') {
        l1Details.forEach(d => d.setAttribute('open', ''));
        l2Details.forEach(d => d.removeAttribute('open'));
    } else {
        l1Details.forEach(d => d.setAttribute('open', ''));
        l2Details.forEach(d => d.setAttribute('open', ''));
    }
};

window.marcarTodo = function (estado) {
    if (currentView === 'ARQ') {
        showToast('La vista de arqueos no usa selección de movimientos.', 'info');
        return;
    }
    document.querySelectorAll('.item-check').forEach(chk => chk.checked = estado);
    document.querySelectorAll('.parent-check').forEach(chk => chk.checked = estado);
    window.calcSelection();
};

// ---------------- Conciliación de arqueos ----------------
function statusArqueoHtml(estado) {
    const meta = {
        OK: ['status-ok', 'OK'],
        DIF: ['status-dif', 'DIF'],
        SIN_FINANZAS: ['status-missing', 'SIN FINANZAS'],
        SIN_DETALLE: ['status-nodetail', 'SIN DETALLE']
    };
    const [clase, texto] = meta[estado] || ['status-nodetail', estado || '—'];
    return `<span class="status-pill ${clase}">${texto}</span>`;
}

function fmtSigned(n) {
    const v = round2(num(n));
    if (!v) return '$ 0,00';
    return `${v > 0 ? '+' : '-'} $ ${fmtMoney(v)}`;
}

function rangoFechasTexto(g) {
    if (!g || !g.fechaMin) return '—';
    if (!g.fechaMax || g.fechaMin === g.fechaMax) return fechaVisual(g.fechaMin);
    return `${fechaVisual(g.fechaMin)} – ${fechaVisual(g.fechaMax)}`;
}

function obtenerArqueosVisibles() {
    const start = $('filter-start-fin').value;
    const end = $('filter-end-fin').value;
    const enRango = (f) => !!f && (!start || f >= start) && (!end || f <= end);

    const grupos = [...arqueosPorCierre.values()].filter(g =>
        g.fechas.some(enRango) || (g.fin && enRango(g.fin.fecha))
    );

    const huerfanos = arqueosOrphans.filter(o => enRango(o.fin.fecha));

    return [...grupos, ...huerfanos].sort((a, b) =>
        (b.orden || 0) - (a.orden || 0) || String(b.idCierre).localeCompare(String(a.idCierre))
    );
}

function filaArqueoHtml(g) {
    const esHuerfano = !!g.esSinDetalle;
    const conciliacion = (g.fin && !esHuerfano && g.conciliacion != null)
        ? (Math.abs(g.conciliacion) <= 0.01
            ? '<span class="val-pos">✓ $ 0,00</span>'
            : `<span class="val-neg">${fmtSigned(g.conciliacion)}</span>`)
        : '—';
    const caja = Math.abs(g.difCaja) > 0.01
        ? `<span class="${g.difCaja > 0 ? 'val-pos' : 'val-neg'}">${fmtSigned(g.difCaja)}</span>`
        : '—';
    const meta = esHuerfano
        ? 'Sin detalle de arqueo'
        : `${g.dias.length} día(s) · ${g.movsCount} mov.`;

    return `<tr data-cierre="${escAttr(g.idCierre)}">
        <td>
            <div class="cierre-id">${esc(g.idCierre)}</div>
            <div class="arqueo-meta">${esc(rangoFechasTexto(g))}</div>
        </td>
        <td>
            <div>${esc(g.chofer || '—')}</div>
            <div class="arqueo-meta">${esc(meta)}</div>
        </td>
        <td class="num">${esHuerfano ? '—' : `$ ${fmtMoney(g.realTotal)}`}</td>
        <td class="num">${g.fin ? `$ ${fmtMoney(g.finMonto)}` : '—'}</td>
        <td class="num">${conciliacion}</td>
        <td class="num">${caja}</td>
        <td>${statusArqueoHtml(g.estado)}</td>
        <td>
            <div class="arqueo-actions">
                <button type="button" class="btn-micro" data-arqueo="${escAttr(g.idCierre)}">Ver</button>
            </div>
        </td>
    </tr>`;
}

function renderArqueos() {
    const cont = $('arqueo-view');
    if (!cont) return;

    const filas = obtenerArqueosVisibles();
    const grupos = filas.filter(f => !f.esSinDetalle);
    const sinDetalle = filas.filter(f => f.esSinDetalle);
    const ok = grupos.filter(g => g.estado === 'OK').length;
    const dif = grupos.filter(g => g.estado === 'DIF').length;
    const sinFin = grupos.filter(g => g.estado === 'SIN_FINANZAS').length;
    const conDifCaja = grupos.filter(g => Math.abs(g.difCaja) > 0.01).length;
    const totalReal = grupos.reduce((a, g) => a + g.realTotal, 0);
    const totalFin = grupos.reduce((a, g) => a + (g.fin ? g.finMonto : 0), 0);
    const enlaceArqueo = `arqueo.html?k=${encodeURIComponent(k || '')}`;
    const txtSinFin = sinFin === 1 ? '1 cierre sin finanzas' : `${sinFin} cierres sin finanzas`;
    const txtHuerfanos = sinDetalle.length
        ? ` · ${sinDetalle.length} huérfano${sinDetalle.length === 1 ? '' : 's'}`
        : '';

    let html = `<div class="arqueo-head">
        <div>
            <div class="arqueo-title">Conciliación de Arqueos</div>
            <div class="arqueo-sub">Real: $ ${fmtMoney(totalReal)} · Finanzas: $ ${fmtMoney(totalFin)} · Dif. de caja: ${fmtSigned(grupos.reduce((a, g) => a + g.difCaja, 0))}</div>
        </div>
        <div class="arqueo-head-actions">
            <a class="btn-micro" href="${enlaceArqueo}" target="_blank" rel="noopener">Ir a Arqueos</a>
            <button type="button" class="btn-micro" onclick="window.cargarDatos()">Actualizar</button>
        </div>
    </div>`;

    if (arqueosError) {
        html += `<div class="arqueo-warning">No se pudo leer la colección <b>arqueos</b>: ${esc(arqueosError.code || arqueosError.message || 'error de conexión')}. La conciliación puede estar incompleta.</div>`;
    }

    html += `<div class="arqueo-kpis">
        <div class="arqueo-kpi"><span class="k">Cierres</span><span class="v">${filas.length}</span><span class="s">${grupos.length} con detalle · ${sinDetalle.length} sin detalle</span></div>
        <div class="arqueo-kpi"><span class="k">Conciliados</span><span class="v" style="color:var(--success-light)">${ok}</span><span class="s">${ok === 1 ? 'cierre OK' : 'cierres OK'}</span></div>
        <div class="arqueo-kpi"><span class="k">Con diferencia</span><span class="v" style="color:var(--accent-edit)">${dif}</span><span class="s">${conDifCaja} con dif. de caja</span></div>
        <div class="arqueo-kpi"><span class="k">Sin finanzas</span><span class="v" style="color:var(--danger)">${sinFin}</span><span class="s">${txtSinFin}${txtHuerfanos}</span></div>
    </div>`;

    if (sinDetalle.length) {
        html += `<div class="arqueo-warning">Hay ${sinDetalle.length} registro(s) de <b>confinanzas</b> con origen ARQUEO que no tienen documentos en <b>arqueos</b>. Revisá si el cierre se borró o si el id no coincide.</div>`;
    }

    if (!filas.length) {
        html += `<div class="empty-state" style="padding:36px 12px;">
            No hay arqueos en el período seleccionado.<br>
            <span class="muted">Cuando registres un cierre en Arqueo de Caja, va a aparecer acá para conciliar contra Finanzas.</span><br>
            <a class="btn-micro" style="display:inline-flex; margin-top:12px; text-decoration:none;" href="${enlaceArqueo}" target="_blank" rel="noopener">Abrir Arqueo de Caja</a>
        </div>`;
        cont.innerHTML = html;
        return;
    }

    html += `<div class="arqueo-table-wrap"><table class="arqueo-table">
        <thead><tr>
            <th>Cierre</th>
            <th>Chofer / detalle</th>
            <th class="num">Real efectivo</th>
            <th class="num">Finanzas</th>
            <th class="num">Conciliación</th>
            <th class="num">Dif. caja</th>
            <th>Estado</th>
            <th></th>
        </tr></thead>
        <tbody>${filas.map(filaArqueoHtml).join('')}</tbody>
    </table></div>`;

    cont.innerHTML = html;

    cont.querySelectorAll('button[data-arqueo]').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.openArqueoModal(btn.dataset.arqueo);
        });
    });

    cont.querySelectorAll('tr[data-cierre]').forEach(tr => {
        tr.addEventListener('dblclick', () => window.openArqueoModal(tr.dataset.cierre));
    });
}

function finanzasDetalleHtml(g) {
    if (!g.fin) {
        return `<div class="arqueo-warning">No hay documento en <b>confinanzas</b> con id <b>${esc(g.idCierre)}</b>. El cierre no impactó en finanzas o el registro fue eliminado.</div>`;
    }

    const f = g.fin;
    const detalle = String(f.detalle || '').trim();

    return `<div class="arqueo-detail-obs" style="border-left-color:var(--success-light);">
        <b>Registro en finanzas</b> ${statusArqueoHtml(g.estado)}<br>
        Monto: <b>$ ${fmtMoney(g.finMonto)}</b> · Fecha: ${esc(fechaVisual(f.fecha))}<br>
        ${esc(f.rubro)} / ${esc(f.subrubro)} · Usuario: ${esc(f.raw?.usuario ?? f.raw?.USUARIO ?? '—')}
        ${detalle ? `<div style="margin-top:6px; color:var(--text-sec);">${esc(detalle)}</div>` : ''}
    </div>`;
}

function detalleArqueoHtml(g) {
    if (g.esSinDetalle) {
        return {
            sub: `${g.idCierre} · ${fechaVisual(g.fechaMin)} · Sin detalle de arqueo`,
            body: `<div class="arqueo-warning">Este registro de finanzas tiene origen ARQUEO, pero no existe ningún documento en <b>arqueos</b> con el mismo idCierre. Puede ser un cierre viejo, un registro manual con id de arqueo o un cierre eliminado.</div>
                <div class="arqueo-detail-grid">
                    <div class="item"><span class="k">Monto en finanzas</span><span class="v">$ ${fmtMoney(g.finMonto)}</span></div>
                    <div class="item"><span class="k">Fecha</span><span class="v">${esc(fechaVisual(g.fechaMin))}</span></div>
                    <div class="item"><span class="k">Estado</span><span class="v">${statusArqueoHtml(g.estado)}</span></div>
                </div>
                ${finanzasDetalleHtml(g)}`
        };
    }

    const dias = g.dias.map(d => {
        const dif = round2(d.diferencia);
        return `<tr>
            <td>${esc(fechaVisual(d.fecha))}</td>
            <td class="num">$ ${fmtMoney(d.sisTotal)}</td>
            <td class="num">$ ${fmtMoney(d.realEfectivo)}</td>
            <td class="num ${Math.abs(dif) > 0.01 ? (dif < 0 ? 'val-neg' : 'val-pos') : ''}">${Math.abs(dif) > 0.01 ? fmtSigned(dif) : '—'}</td>
            <td class="num">${d.cantidadMovimientos || d.movimientos.length || 0}</td>
        </tr>`;
    }).join('');

    const gastos = g.gastosDetalle.length
        ? `<div style="margin-top:12px;"><div class="arqueo-modal-label">Gastos declarados</div>
            <table class="arqueo-detail-days"><thead><tr><th>Fecha</th><th>Motivo</th><th class="num">Monto</th></tr></thead><tbody>
            ${g.gastosDetalle.map(x => `<tr><td>${esc(fechaVisual(x.fecha))}</td><td>${esc(x.motivo || '—')}</td><td class="num">- $ ${fmtMoney(x.monto)}</td></tr>`).join('')}
            </tbody></table></div>`
        : '';

    const obs = g.observaciones
        ? `<div class="arqueo-detail-obs"><b>Observaciones:</b><br>${esc(g.observaciones)}</div>`
        : '';

    const movs = g.dias.flatMap(d => d.movimientos);
    const movsHtml = movs.length
        ? `<details style="margin-top:10px;"><summary style="cursor:pointer; color:var(--text-sec); font-size:10px; font-weight:700;">Ver IDs de movimientos (${movs.length})</summary>
            <div class="arqueo-movs">${movs.map(m => `<span>${esc(m)}</span>`).join('')}</div></details>`
        : '';

    return {
        sub: `${g.idCierre} · ${rangoFechasTexto(g)} · ${g.chofer}`,
        body: `<div class="arqueo-detail-grid">
            <div class="item"><span class="k">Efectivo real</span><span class="v">$ ${fmtMoney(g.realTotal)}</span></div>
            <div class="item"><span class="k">Finanzas</span><span class="v">${g.fin ? `$ ${fmtMoney(g.finMonto)}` : 'Sin registro'}</span></div>
            <div class="item"><span class="k">Conciliación</span><span class="v">${g.fin ? (Math.abs(g.conciliacion) <= 0.01 ? '✓ $ 0,00' : fmtSigned(g.conciliacion)) : '—'}</span></div>
            <div class="item"><span class="k">Diferencia de caja</span><span class="v">${Math.abs(g.difCaja) <= 0.01 ? '—' : fmtSigned(g.difCaja)}</span></div>
            <div class="item"><span class="k">Días / movimientos</span><span class="v">${g.dias.length} / ${g.movsCount}</span></div>
            <div class="item"><span class="k">Estado</span><span class="v">${statusArqueoHtml(g.estado)}</span></div>
        </div>
        <div class="arqueo-modal-label">Días cerrados</div>
        <table class="arqueo-detail-days"><thead><tr>
            <th>Fecha</th><th class="num">Sistema</th><th class="num">Real</th><th class="num">Diferencia</th><th class="num">Movs.</th>
        </tr></thead><tbody>${dias}</tbody></table>
        ${gastos}
        ${obs}
        ${finanzasDetalleHtml(g)}
        ${movsHtml}
        <div style="margin-top:12px; color:var(--text-sec); font-size:9px;">
            Auditor: ${esc(g.auditor)}${g.hora ? ` · Hora: ${esc(g.hora)}` : ''}
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:12px;">
            <a class="btn-micro" style="text-decoration:none;" href="arqueo.html?k=${encodeURIComponent(k || '')}" target="_blank" rel="noopener">Abrir módulo de Arqueos</a>
        </div>`
    };
}

window.openArqueoModal = function (idCierre) {
    const id = String(idCierre || '').trim();
    const g = arqueosPorCierre.get(id) || arqueosOrphans.find(x => x.idCierre === id);
    if (!g) {
        showToast('No se encontró el arqueo ' + id + '.', 'error');
        return;
    }

    const detalle = detalleArqueoHtml(g);
    $('arqueo-modal-title').textContent = g.esSinDetalle ? 'Registro sin detalle de arqueo' : 'Detalle del Arqueo';
    $('arqueo-modal-sub').textContent = detalle.sub;
    $('arqueo-modal-body').innerHTML = detalle.body;
    $('arqueoModal').style.display = 'flex';
};

window.closeArqueoModal = function () {
    $('arqueoModal').style.display = 'none';
    $('arqueo-modal-body').innerHTML = '';
};

function ampliarFiltroParaArqueo(idCierre) {
    const id = String(idCierre || '').trim();
    const g = arqueosPorCierre.get(id) || arqueosOrphans.find(x => x.idCierre === id);
    if (!g) return;

    const fechas = [g.fechaMin, g.fechaMax, g.fin?.fecha].filter(Boolean).sort();
    if (!fechas.length) return;

    const ini = fechas[0];
    const fin = fechas[fechas.length - 1];
    if (!$('filter-start-fin').value || $('filter-start-fin').value > ini) $('filter-start-fin').value = ini;
    if (!$('filter-end-fin').value || $('filter-end-fin').value < fin) $('filter-end-fin').value = fin;
}

window.toggleChildren = function (source) {
    const parent = source.closest('details');
    if (!parent) return;
    parent.querySelectorAll('input[type="checkbox"]').forEach(c => {
        c.checked = source.checked;
    });
    window.calcSelection();
};

function updateDashboardValues(ingresos, gastos, total, isSelectionMode) {
    const gastosAbs = Math.abs(gastos);
    const margen = ingresos > 0 ? ((ingresos - gastosAbs) / ingresos) * 100 : 0;

    $('dash-in').textContent = fmtMoney(ingresos);
    $('dash-out').textContent = fmtMoney(gastosAbs);
    $('dash-total').textContent = fmtMoney(total);
    $('dash-total').className = `value ${total >= 0 ? 'val-pos' : 'val-neg'}`;

    $('dash-margen').textContent = `${margen.toFixed(1)} %`;
    $('dash-margen').className = `value ${margen >= 0 ? 'val-pos' : 'val-neg'}`;

    const cards = $('dashboard-panel').querySelectorAll('.card');
    cards.forEach(c => c.classList.toggle('active-selection', !!isSelectionMode));

    $('lbl-in').textContent = isSelectionMode ? 'INGRESOS (SEL)' : 'INGRESOS';
    $('lbl-out').textContent = isSelectionMode ? 'EGRESOS (SEL)' : 'EGRESOS';
    $('lbl-total').textContent = isSelectionMode ? 'BALANCE (SEL)' : 'BALANCE NETO';
    $('lbl-margen').textContent = isSelectionMode ? 'MARGEN (SEL)' : 'MARGEN OPERATIVO';
}

window.calcSelection = function () {
    const checks = document.querySelectorAll('.item-check:checked');

    if (!checks.length) {
        updateDashboardValues(currentSummary.ingresos, currentSummary.gastos, currentSummary.total, false);

        document.querySelectorAll('.l1-details').forEach(l1 => {
            const l1Span = l1.querySelector('summary .tree-total');
            const origL1 = Number(l1Span?.dataset.original || 0);
            paintTotal(l1Span, origL1);

            l1.querySelectorAll('.l2-details').forEach(l2 => {
                const l2Span = l2.querySelector('summary .tree-total');
                const origL2 = Number(l2Span?.dataset.original || 0);
                paintTotal(l2Span, origL2);
            });
        });
        return;
    }

    let selIngresos = 0;
    let selGastos = 0;

    checks.forEach(c => {
        const v = num(c.value);
        if (v >= 0) selIngresos += v;
        else selGastos += v;
    });

    updateDashboardValues(selIngresos, selGastos, selIngresos + selGastos, true);

    document.querySelectorAll('.l1-details').forEach(l1 => {
        let l1Total = 0;

        l1.querySelectorAll('.l2-details').forEach(l2 => {
            let l2Total = 0;
            l2.querySelectorAll('.item-check:checked').forEach(chk => {
                l2Total += num(chk.value);
            });
            paintTotal(l2.querySelector('summary .tree-total'), l2Total);
            l1Total += l2Total;
        });

        paintTotal(l1.querySelector('summary .tree-total'), l1Total);
    });
};

// ---------------- Datalists ----------------
function setupDatalists(options) {
    const dl1 = $('list_l1');
    dl1.innerHTML = '';
    Object.keys(options).forEach(l1 => {
        const op = document.createElement('option');
        op.value = l1;
        dl1.appendChild(op);
    });
}

window.updateDatalistL2 = function () {
    const val1 = $('input_l1').value.trim();
    const dl2 = $('list_l2');
    dl2.innerHTML = '';
    $('input_l2').value = '';

    if (globalOptions[val1]) {
        globalOptions[val1].forEach(sub => {
            const op = document.createElement('option');
            op.value = sub;
            dl2.appendChild(op);
        });
    }
};

// ---------------- Modal ----------------
window.setTipo = function (tipo) {
    $('modal-tipo').value = tipo;

    const esIngreso = tipo === 'INGRESO';
    $('btn-ingreso').classList.toggle('active', esIngreso);
    $('btn-egreso').classList.toggle('active', !esIngreso);

    const input = $('monto');
    if (esIngreso) {
        input.style.backgroundColor = 'rgba(45, 212, 191, 0.1)';
        input.style.borderColor = 'var(--success-light)';
        input.style.color = 'var(--success-light)';
    } else {
        input.style.backgroundColor = 'rgba(255, 71, 87, 0.1)';
        input.style.borderColor = 'var(--danger)';
        input.style.color = 'var(--danger)';
    }

    window.checkDiff();
};

window.addPayRow = function (type) {
    const t = type === 'trans' ? 'trans' : 'depo';
    payIndex++;
    const id = `payrow-${payIndex}`;
    const container = $(`list-${t}`);
    if (!container) return;

    const div = document.createElement('div');
    div.className = 'pay-row';
    div.id = id;
    div.innerHTML = `
        <input type="number" step="0.01" min="0" class="pay-val-${t} pay-calc-input" placeholder="Monto ($)" aria-label="Monto">
        <input type="text" class="pay-ref-${t}" placeholder="N° Op." autocomplete="off" aria-label="Número de operación">
        <button type="button" class="btn-del-pago" title="Quitar">✖</button>`;

    const monto = div.querySelector('.pay-calc-input');
    monto.addEventListener('input', () => window.calcTotalMonto());

    div.querySelector('.btn-del-pago').addEventListener('click', () => {
        div.remove();
        window.calcTotalMonto();
    });

    container.appendChild(div);
};

window.calcTotalMonto = function () {
    if (currentEditMode) return;

    let total = num($('pay-efvo').value);
    document.querySelectorAll('.pay-calc-input').forEach(inp => {
        total += num(inp.value);
    });

    $('monto').value = total > 0 ? total.toFixed(2) : '';
};

window.checkDiff = function () {
    if (!currentEditMode) {
        $('audit-msg').style.display = 'none';
        return;
    }

    const oldRaw = $('orig-amount').value;
    if (oldRaw === '') {
        $('audit-msg').style.display = 'none';
        return;
    }

    const oldMath = num(oldRaw);
    const newAbs = num($('monto').value);
    const tipo = $('modal-tipo').value;
    const newMath = tipo === 'EGRESO' ? -newAbs : newAbs;
    const diff = newMath - oldMath;

    const box = $('audit-msg');
    if (Math.abs(diff) > 0.004) {
        box.style.display = 'block';
        box.textContent = `Diferencia Monetaria: ${diff > 0 ? '▲ +' : '▼ -'} $ ${fmtMoney(diff)}`;
        box.style.color = diff > 0 ? 'var(--success-light)' : 'var(--danger)';
    } else {
        box.style.display = 'none';
    }
};

window.openModal = function (mode, id) {
    deleteRequested = false;
    currentEditMode = mode === 'edit';
    currentEditId = currentEditMode ? String(id || '') : '';

    const modal = $('modal');
    const pinArea = $('pin-area');
    const btnMain = $('btn-main');
    const btnDel = $('btn-del');
    const box = document.querySelector('.modal-content');

    pinArea.style.display = 'none';
    $('auth-pin').value = '';
    $('audit-msg').style.display = 'none';
    btnMain.style.display = 'block';
    btnMain.disabled = false;
    btnDel.style.display = 'none';

    if (!currentEditMode) {
        document.body.classList.remove('edit-mode');
        $('expenseForm').reset();
        $('edit-id').value = '';
        $('orig-amount').value = '';
        $('modal-fecha').value = todayISO();
        $('input_l1').value = '';
        $('input_l2').value = '';
        $('l3').value = '';
        $('monto').value = '';
        $('pay-efvo').value = '';
        $('list-depo').innerHTML = '';
        $('list-trans').innerHTML = '';

        window.addPayRow('depo');
        window.addPayRow('trans');
        window.setTipo('EGRESO');

        $('multipago-container').style.display = 'block';
        $('monto').readOnly = true;
        $('modal-title').textContent = 'Nuevo Registro';
        btnMain.textContent = 'GUARDAR';
        if (box) box.style.borderColor = 'var(--glass-border)';
    } else {
        const r = allRows.find(x => x.id === currentEditId);
        if (!r) {
            showToast('No se encontró el registro.', 'error');
            return;
        }

        if (esAutomatico(r.raw)) {
            currentEditMode = false;
            currentEditId = '';
            $('edit-id').value = '';
            $('orig-amount').value = '';
            document.body.classList.remove('edit-mode');
