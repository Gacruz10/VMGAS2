// ---------------- Guardar nuevo ----------------
function leerPagos(tipo) {
    const out = [];
    document.querySelectorAll(`#list-${tipo} .pay-row`).forEach(row => {
        const m = num(row.querySelector(`.pay-val-${tipo}`)?.value);
        const ref = row.querySelector(`.pay-ref-${tipo}`)?.value.trim() || 'S/N';
        if (m > 0) out.push({ monto: round2(m), ref });
    });
    return out;
}

function detalleConPagos(base, pagos) {
    const partes = [];

    if (pagos.efectivo > 0) {
        partes.push(`Efvo: $${fmtMoney(pagos.efectivo)}`);
    }
    if (pagos.depositos.length) {
        partes.push(`Dep: ${pagos.depositos.map(d => `$${fmtMoney(d.monto)} (Op:${d.ref})`).join(', ')}`);
    }
    if (pagos.transferencias.length) {
        partes.push(`Transf: ${pagos.transferencias.map(t => `$${fmtMoney(t.monto)} (Op:${t.ref})`).join(', ')}`);
    }

    return partes.length ? `${base} | PAGOS: ${partes.join(' | ')}` : base;
}

async function guardarNuevo() {
    if (!navigator.onLine) {
        showToast('⛔ Necesitás internet para guardar.', 'error');
        return;
    }

    const fecha = $('modal-fecha').value;
    const rubro = $('input_l1').value.trim();
    const subrubro = $('input_l2').value.trim();
    const detalleBase = $('l3').value.trim();
    const tipo = $('modal-tipo').value;
    const monto = num($('monto').value);

    if (!fecha) return showToast('Ingresá la fecha.', 'error');
    if (!rubro) return showToast('Ingresá el rubro.', 'error');
    if (!subrubro) return showToast('Ingresá el sub-rubro.', 'error');
    if (!detalleBase) return showToast('Ingresá el detalle.', 'error');
    if (monto <= 0) return showToast('El monto debe ser mayor a cero.', 'error');

    const pagos = {
        efectivo: round2(num($('pay-efvo').value)),
        depositos: leerPagos('depo'),
        transferencias: leerPagos('trans')
    };

    const totalPagos = pagos.efectivo +
        pagos.depositos.reduce((a, d) => a + d.monto, 0) +
        pagos.transferencias.reduce((a, t) => a + t.monto, 0);

    if (totalPagos <= 0) return showToast('Ingresá al menos un medio de pago.', 'error');
    if (Math.abs(totalPagos - monto) > 0.01) {
        return showToast('El total no coincide con los medios de pago.', 'error');
    }

    if (pagos.transferencias.length + pagos.depositos.length + 3 > MAX_BATCH) {
        return showToast('Demasiados medios de pago para un solo registro.', 'error');
    }

    const btn = $('btn-main');
    setBtn(btn, true, 'GUARDANDO...', 'GUARDAR');
    toggleLoader(true, 'GUARDANDO REGISTRO...');

    try {
        const detalle = detalleConPagos(detalleBase, pagos);
        const mainRef = doc(collection(db, 'confinanzas'));
        const batch = writeBatch(db);
        const ahora = Date.now();

        batch.set(mainRef, {
            id: mainRef.id,
            fecha,
            rubro,
            subrubro,
            detalle,
            monto: round2(monto),
            usuario: usuarioActivo,
            tipo,
            origen: 'MANUAL',
            pagos,
            timestamp: serverTimestamp(),
            timestampMs: ahora
        });

        // Impuesto Ley 25413: 0,6% por cada transferencia.
        const descCortaBase = detalleBase.length > 27 ? `${detalleBase.slice(0, 27)}...` : detalleBase;
        pagos.transferencias.forEach(t => {
            const impuesto = round2(t.monto * TAX_TRANSFERENCIA);
            if (impuesto <= 0) return;

            const taxRef = doc(collection(db, 'confinanzas'));
            batch.set(taxRef, {
                id: taxRef.id,
                fecha,
                rubro: 'CUENTA BANCARIA',
                subrubro: 'IMPUESTO LEY 25413',
                detalle: `${descCortaBase} | LEY 25413 (0.6% de $${fmtMoney(t.monto)}) | Op: ${t.ref}`,
                monto: impuesto,
                usuario: usuarioActivo,
                tipo: 'EGRESO',
                origen: 'IMPUESTO',
                referencia: mainRef.id,
                timestamp: serverTimestamp(),
                timestampMs: ahora
            });
        });

        await batch.commit();

        showToast('✅ Registro guardado.', 'success');
        window.closeModal();
        await cargarDatos();
    } catch (e) {
        console.error(e);
        showToast('Error al guardar: ' + (e.code || e.message || 'intente nuevamente'), 'error');
    } finally {
        toggleLoader(false);
        setBtn(btn, false, 'GUARDANDO...', 'GUARDAR');
    }
}

// ---------------- PIN ----------------
function nuevoPin() {
    return Math.random().toString(36).substring(2, 6).toLowerCase();
}

async function cargarImpuestosAsociados(idPrincipal) {
    const mapa = new Map();

    allRows.forEach(r => {
        if (r.id !== idPrincipal && r.origen === 'IMPUESTO' && r.referencia === idPrincipal) {
            mapa.set(r.id, { id: r.id, fecha: r.fecha, monto: r.monto, raw: r.raw });
        }
    });

    try {
        const snap = await getDocs(query(collection(db, 'confinanzas'), where('referencia', '==', idPrincipal)));
        snap.forEach(d => {
            if (d.id === idPrincipal) return;
            const x = d.data();
            const origen = String(x.origen ?? x.ORIGEN ?? '').trim().toUpperCase();
            if (origen !== 'IMPUESTO') return;
            mapa.set(d.id, {
                id: d.id,
                fecha: normFecha(x.fecha ?? x.FECHA),
                monto: num(x.monto ?? x.MONTO),
                raw: x
            });
        });
    } catch (e) {
        console.warn('No se pudieron consultar impuestos asociados:', e);
        if (!mapa.size) {
            showToast('No se pudieron verificar los impuestos asociados. Se usará la copia local.', 'info', 5000);
        }
    }

    return [...mapa.values()];
}

window.confirmEdit = async function () {
    if (!currentEditId) return showToast('No hay un registro seleccionado.', 'error');
    if (!navigator.onLine) return showToast('⛔ Necesitás internet para modificar.', 'error');

    const pin = $('auth-pin').value.trim();
    if (!pin) return showToast('Ingresá el PIN.', 'error');

    const r = allRows.find(x => x.id === currentEditId);
    if (!r) return showToast('No se encontró el registro.', 'error');
    if (esAutomatico(r.raw)) {
        return showToast(avisoAutomatico(r.raw), 'error', 6000);
    }

    let fecha = r.fecha;
    let rubro = r.rubro;
    let subrubro = r.subrubro;
    let detalle = r.detalle;
    let monto = Math.abs(r.monto);
    let tipo = r.tipo;

    if (!deleteRequested) {
        fecha = $('modal-fecha').value;
        rubro = $('input_l1').value.trim();
        subrubro = $('input_l2').value.trim();
        detalle = $('l3').value.trim();
        monto = num($('monto').value);
        tipo = $('modal-tipo').value;

        if (!fecha) return showToast('Ingresá la fecha.', 'error');
        if (!rubro) return showToast('Ingresá el rubro.', 'error');
        if (!subrubro) return showToast('Ingresá el sub-rubro.', 'error');
        if (!detalle) return showToast('Ingresá el detalle.', 'error');
        if (monto <= 0) return showToast('El monto debe ser mayor a cero.', 'error');
    }

    const btn = document.querySelector('#pin-area button');
    const normalText = deleteRequested ? 'CONFIRMAR BORRADO' : 'CONFIRMAR CAMBIO';
    setBtn(btn, true, 'VALIDANDO...', normalText);
    toggleLoader(true, 'VALIDANDO PIN...');

    try {
        const accion = deleteRequested ? `ELIMINAR_FINANZA ${currentEditId}` : `EDITAR_FINANZA ${currentEditId}`;
        const p = String(pin).trim().toLowerCase();
        const pinRef = doc(db, 'seguridad', 'pin');
        const ref = doc(db, 'confinanzas', currentEditId);
        const impuestosAsociados = (deleteRequested || fecha !== r.fecha)
            ? await cargarImpuestosAsociados(currentEditId)
            : [];

        // PIN, rotación, cambio y auditoría en una sola transacción:
        // si una escritura falla, el PIN dinámico no se consume.
        const pinTipo = await runTransaction(db, async (tx) => {
            const pinSnap = await tx.get(pinRef);
            if (!pinSnap.exists()) throw new Error('No hay PIN configurado en seguridad/pin.');

            const pd = pinSnap.data();
            const dinamico = String(pd.dinamico ?? '').trim().toLowerCase();
            const maestro = String(pd.maestro ?? '').trim().toLowerCase();

            let tipoUsado = '';

            if (dinamico && p === dinamico) {
                tipoUsado = 'DINAMICO';
                tx.update(pinRef, { dinamico: nuevoPin() });
            } else if (maestro && p === maestro) {
                tipoUsado = 'MAESTRO';
            } else {
                throw new Error('PIN inválido o ya utilizado.');
            }

            tx.set(doc(collection(db, 'historialPin')), {
                fecha_hora: serverTimestamp(),
                usuario: usuarioActivo,
                accion,
                tipo: tipoUsado
            });

            if (deleteRequested) {
                // El registro principal y sus impuestos automáticos se eliminan
                // en la misma transacción para no dejar egresos huérfanos.
                tx.delete(ref);
                impuestosAsociados.forEach(t => tx.delete(doc(db, 'confinanzas', t.id)));

                tx.set(doc(collection(db, 'auditoria')), {
                    tipo: 'ELIMINAR_FINANZA',
                    finId: currentEditId,
                    usuario: usuarioActivo,
                    pinTipo: tipoUsado,
                    antes: r.raw,
                    impuestosEliminados: impuestosAsociados.map(t => t.id),
                    fecha_hora: serverTimestamp()
                });
                tx.set(doc(collection(db, 'alarmas')), {
                    tipo: 'ELIMINACIÓN',
                    descripcion: `[${currentEditId}] Eliminado por ${usuarioActivo}: ${r.rubro} / ${r.subrubro} · $${fmtMoney(r.monto)}${impuestosAsociados.length ? ` · impuestos: ${impuestosAsociados.length}` : ''}`,
                    usuario: usuarioActivo,
                    pendiente: true,
                    fecha_hora: serverTimestamp()
                });
            } else {
                const despues = {
                    fecha,
                    rubro,
                    subrubro,
                    detalle,
                    monto: round2(monto),
                    tipo,
                    usuario: usuarioActivo,
                    editadoPor: usuarioActivo,
                    editadoTs: serverTimestamp(),
                    timestamp: serverTimestamp(),
                    timestampMs: Date.now()
                };

                tx.update(ref, despues);

                // Si cambia la fecha del registro principal, los impuestos
                // asociados deben quedar en la misma fecha contable.
                if (fecha !== r.fecha) {
                    impuestosAsociados.forEach(t => tx.update(doc(db, 'confinanzas', t.id), { fecha }));
                }

                tx.set(doc(collection(db, 'auditoria')), {
                    tipo: 'EDITAR_FINANZA',
                    finId: currentEditId,
                    usuario: usuarioActivo,
                    pinTipo: tipoUsado,
                    antes: r.raw,
                    despues: {
                        fecha,
                        rubro,
                        subrubro,
                        detalle,
                        monto: round2(monto),
                        tipo,
                        editadoPor: usuarioActivo,
                        editadoMs: Date.now()
                    },
                    impuestosActualizados: fecha !== r.fecha ? impuestosAsociados.map(t => t.id) : [],
                    fecha_hora: serverTimestamp()
                });
                tx.set(doc(collection(db, 'alarmas')), {
                    tipo: 'MODIFICACIÓN',
                    descripcion: `[${currentEditId}] Modificado por ${usuarioActivo}: ${rubro} / ${subrubro} · $${fmtMoney(monto)}`,
                    usuario: usuarioActivo,
                    pendiente: true,
                    fecha_hora: serverTimestamp()
                });
            }

            return tipoUsado;
        });

        showToast(deleteRequested ? '🗑️ Registro eliminado.' : '✅ Registro actualizado.', 'success');
        window.closeModal();
        await cargarDatos();
    } catch (e) {
        console.error(e);
        showToast(e.message || 'Error al validar el PIN.', 'error');
        $('auth-pin').value = '';
    } finally {
        toggleLoader(false);
        setBtn(btn, false, 'VALIDANDO...', normalText);
    }
};

window.submitPinChange = async function () {
    if (!navigator.onLine) return showToast('⛔ Necesitás internet para cambiar el PIN.', 'error');

    const oldPin = $('old-pin').value.trim();
    const newPin = $('new-pin').value.trim();

    if (!/^\d{4}$/.test(newPin)) {
        return showToast('El nuevo PIN debe tener exactamente 4 dígitos.', 'error');
    }

    const btn = $('btn-pin-save');
    setBtn(btn, true, 'ACTUALIZANDO...', 'ACTUALIZAR LLAVE');
    toggleLoader(true, 'ACTUALIZANDO PIN...');

    try {
        const pinRef = doc(db, 'seguridad', 'pin');

        const accion = await runTransaction(db, async (tx) => {
            const snap = await tx.get(pinRef);
            const d = snap.exists() ? snap.data() : {};
            const maestro = String(d.maestro ?? '').trim().toLowerCase();
            const existe = !!maestro;

            // Si todavía no hay PIN maestro, solo puede crearlo un usuario
            // con permiso USUARIOS. Si ya existe, se exige el PIN actual.
            if (!existe && !permisoActivo('USUARIOS')) {
                throw new Error('Solo un usuario con permiso USUARIOS puede inicializar el PIN maestro.');
            }
            if (existe && oldPin.toLowerCase() !== maestro) {
                throw new Error('PIN actual incorrecto.');
            }

            tx.set(pinRef, {
                maestro: newPin,
                actualizadoPor: usuarioActivo,
                actualizadoTs: serverTimestamp()
            }, { merge: true });

            const tipoAccion = existe ? 'CAMBIO PIN MAESTRO' : 'INICIALIZACIÓN PIN MAESTRO';

            tx.set(doc(collection(db, 'historialPin')), {
                fecha_hora: serverTimestamp(),
                usuario: usuarioActivo,
                accion: tipoAccion,
                tipo: 'MAESTRO'
            });

            tx.set(doc(collection(db, 'alarmas')), {
                tipo: 'SEGURIDAD',
                descripcion: `${tipoAccion} realizado por ${usuarioActivo}.`,
                usuario: usuarioActivo,
                pendiente: true,
                fecha_hora: serverTimestamp()
            });

            return tipoAccion;
        });

        $('pinModal').style.display = 'none';
        showToast(`🔑 ${accion} correcto.`, 'success');
    } catch (e) {
        console.error(e);
        showToast(e.message || 'Error al cambiar el PIN.', 'error');
    } finally {
        toggleLoader(false);
        setBtn(btn, false, 'ACTUALIZANDO...', 'ACTUALIZAR LLAVE');
    }
};

window.exportarPDF = function (modo) {
    $('export-menu').classList.remove('show');

    if (!window.jspdf || !window.jspdf.jsPDF) {
        return showToast('No se pudo cargar el generador de PDF.', 'error');
    }

    const { jsPDF } = window.jspdf;
    const docPdf = new jsPDF();

    if (typeof docPdf.autoTable !== 'function') {
        return showToast('No se pudo cargar la tabla del PDF.', 'error');
    }

    const l1Nodes = document.querySelectorAll('.l1-details');
    const exportGroups = [];
    let totalIng = 0;
    let totalGas = 0;

    l1Nodes.forEach(l1Node => {
        const l1Name = l1Node.querySelector('.l1-name')?.textContent.trim() || '';
        const l2Nodes = l1Node.querySelectorAll('.l2-details');
        const l1Group = { name: l1Name, total: 0, subs: [], items: [] };
        let l1HasSelection = false;

        l2Nodes.forEach(l2Node => {
            const l2Name = l2Node.querySelector('.l2-name')?.textContent.trim() || '';
            const checkedItems = l2Node.querySelectorAll('.item-check:checked');
            const l2Group = { name: l2Name, total: 0, items: [] };

            checkedItems.forEach(chk => {
                const val = num(chk.value);
                const row = chk.closest('tr');
                const cols = row.querySelectorAll('td');
                const fecha = cols[1]?.textContent.trim() || '';
                const detalle = cols[2]?.textContent.trim() || '';

                l2Group.total += val;
                l2Group.items.push({ fecha, detalle, monto: val });
                l1Group.total += val;
                l1Group.items.push({ fecha, detalle, monto: val });

                if (val >= 0) totalIng += val;
                else totalGas += val;
            });

            if (l2Group.items.length) {
                l1Group.subs.push(l2Group);
                l1HasSelection = true;
            }
        });

        if (l1HasSelection) exportGroups.push(l1Group);
    });

    if (!exportGroups.length) {
        return showToast('Seleccioná al menos un ítem para exportar.', 'info');
    }

    const bodyFinal = [];

    function addItemRow(item) {
        bodyFinal.push([
            item.fecha,
            item.detalle,
            {
                content: fmtMoney(item.monto),
                styles: {
                    textColor: item.monto < 0 ? [220, 53, 69] : [0, 80, 0],
                    halign: 'right',
                    fontStyle: 'bold'
                }
            }
        ]);
    }

    exportGroups.forEach(group => {
        bodyFinal.push([{
            content: `${group.name.toUpperCase()}   (${fmtTri(group.total)})`,
            colSpan: 3,
            styles: {
                fillColor: [33, 33, 33],
                textColor: [255, 215, 0],
                fontStyle: 'bold',
                halign: 'left',
                cellPadding: 4,
                lineWidth: { bottom: 1 },
                lineColor: [50, 50, 50]
            }
        }]);

        if (modo === 'jerarquico') {
            group.subs.forEach(sub => {
                bodyFinal.push([{
                    content: `      >> ${sub.name}   (${fmtTri(sub.total)})`,
                    colSpan: 3,
                    styles: {
                        fillColor: [240, 240, 240],
                        textColor: [50, 50, 50],
                        fontStyle: 'bold',
                        halign: 'left',
                        cellPadding: 2,
                        fontSize: 9
                    }
                }]);
                sub.items.forEach(addItemRow);
            });
        } else {
            group.items.forEach(addItemRow);
        }
    });

    const titulo = modo === 'jerarquico' ? 'Reporte Jerárquico' : 'Reporte Simplificado';
    const fechaGen = new Date().toLocaleDateString('es-AR');
    const balance = totalIng + totalGas;

    docPdf.setFontSize(14);
    docPdf.setTextColor(40);
    docPdf.text(titulo, 14, 15);

    docPdf.setFontSize(8);
    docPdf.setTextColor(100);
    docPdf.text(`Generado: ${fechaGen}`, 14, 20);

    docPdf.autoTable({
        startY: 22,
        head: [['INGRESOS', 'EGRESOS', 'BALANCE NETO']],
        body: [[fmtMoney(totalIng), fmtMoney(Math.abs(totalGas)), fmtMoney(Math.abs(balance))]],
        theme: 'grid',
        headStyles: { fillColor: [33, 33, 33], textColor: 255, halign: 'center', fontSize: 9 },
        bodyStyles: { halign: 'center', fontSize: 9, fontStyle: 'bold' },
        columnStyles: {
            0: { textColor: [0, 80, 0] },
            1: { textColor: [220, 53, 69] },
            2: { textColor: balance >= 0 ? [0, 80, 0] : [220, 53, 69] }
        },
        tableWidth: 'wrap',
        margin: { left: 14 }
    });

    docPdf.autoTable({
        startY: docPdf.lastAutoTable.finalY + 6,
        head: [['FECHA', 'DETALLE', 'MONTO ($)']],
        body: bodyFinal,
        theme: 'plain',
        styles: {
            fontSize: 8,
            cellPadding: 3,
            overflow: 'linebreak',
            lineColor: [220, 220, 220],
            lineWidth: 0.1
        },
        headStyles: { fillColor: [59, 130, 246], textColor: 255, fontStyle: 'bold' },
        columnStyles: {
            0: { cellWidth: 22 },
            1: { cellWidth: 'auto' },
            2: { cellWidth: 32 }
        },
        margin: { left: 14, right: 14 }
    });

    const pageCount = docPdf.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
        docPdf.setPage(i);
        docPdf.setFontSize(7);
        docPdf.setTextColor(150);
        docPdf.text('Control Finanzas VMGAS2', 14, docPdf.internal.pageSize.height - 10);
        docPdf.text(`Pág ${i}/${pageCount}`, docPdf.internal.pageSize.width - 20, docPdf.internal.pageSize.height - 10);
    }

    docPdf.save(`Balance_${modo}_${fechaGen.replace(/\//g, '-')}.pdf`);
};
  </script>
