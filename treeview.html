<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VM Gas · Visor Pro</title>
<style>
:root{--bg:#eef1f6;--card:#ffffff;--head:#ffffff;--line:#dfe4ee;--text:#1c2638;--dim:#6b7689;--blue:#1e6fd9;--green:#0f9d58;--orange:#e8820c;--red:#e5484d;--purple:#7c3aed;--purpleBg:#f3ecff;--shadow:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.05)}
body.dark{--bg:#0e1420;--card:#18213a;--head:#141c30;--line:#2a3555;--text:#e6ebf5;--dim:#8f9bb8;--blue:#4c9bff;--green:#34d399;--orange:#fb923c;--red:#f87171;--purple:#a78bfa;--purpleBg:#231a3d;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:20;background:var(--head);box-shadow:var(--shadow);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.brand{font-weight:900;letter-spacing:.5px;color:var(--blue);font-size:15px}
.brand span{color:var(--dim);font-weight:600}
input,select,button,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
input[type=date]{color-scheme:light}
body.dark input[type=date]{color-scheme:dark}
button{cursor:pointer;white-space:nowrap}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent}
button.on{border-color:var(--blue);color:var(--blue);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1}
main{padding:12px;padding-bottom:110px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin:10px 0;overflow:hidden}
details{margin:0}
details>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--dim);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.dayhead{background:var(--head);border-left:4px solid var(--blue)}
.turnhead{border-left:4px solid var(--red)}
.turnhead.closed{border-left-color:var(--dim)}
.purple{background:var(--purpleBg);border:1px solid var(--purple);border-radius:10px;margin:10px;overflow:hidden}
.purple>summary{color:var(--purple);font-weight:800}
.trip{border:1px solid var(--line);border-radius:10px;margin:8px;background:var(--card)}
.trip>summary{background:var(--bg);border-radius:10px}
.body{padding:10px 14px}
.pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.3px;white-space:nowrap}
.p-live{background:rgba(229,72,77,.12);color:var(--red);border:1px solid var(--red)}
.p-closed{background:var(--bg);color:var(--dim);border:1px solid var(--line)}
.p-route{background:rgba(232,130,12,.12);color:var(--orange);border:1px solid var(--orange)}
.p-done{background:rgba(15,157,88,.12);color:var(--green);border:1px solid var(--green)}
.p-tag{background:rgba(30,111,217,.1);color:var(--blue);border:1px solid var(--blue)}
.muted{color:var(--dim);font-size:12px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--red)!important}
.money{font-weight:800;color:var(--green)}
.money.blue{color:var(--blue)}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.lbl{font-size:11px;font-weight:800;letter-spacing:.4px;margin-right:4px}
.l-ini{color:var(--green)}.l-fin{color:var(--orange)}.l-tot{color:var(--blue)}
.qbox{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:12px;font-variant-numeric:tabular-nums}
.qbox b.o{color:var(--orange)}
.qbox .sep{color:var(--dim)}
.stat{display:flex;gap:6px;align-items:baseline}
.stat .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
.sale{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}
.sale:hover{background:var(--bg)}
.sale .hora{font-weight:700;color:var(--dim);font-size:12px}
.sale .cli{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sale .det{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
.sale .tot{font-weight:800;text-align:right}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--head);z-index:2;cursor:pointer;font-size:12px;color:var(--dim);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.sticky,th.sticky{position:sticky;left:0;background:var(--card);z-index:1}
th.sticky{z-index:3;background:var(--head)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tbody tr.sel td{background:rgba(30,111,217,.14)}
tfoot td{font-weight:800;background:var(--head);position:sticky;bottom:0}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:16px}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.fgrid input{color:var(--text)}
.fgrid input.changed{border-color:var(--orange);background:rgba(232,130,12,.08)}
.warnbox{background:rgba(229,72,77,.08);border:1px solid var(--red);color:var(--red);padding:8px 10px;border-radius:8px;font-size:12px;margin:10px 0}
.selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--blue);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.selbar.show{display:block}
.loader{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3);z-index:60;color:#fff;font-weight:700}
.loader.show{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:10px;display:none;z-index:70;max-width:90vw}
.toast.show{display:block}
.filters{display:none;margin-top:8px}
.filters.open{display:block}
.cols-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(min-width:720px){.cols-grid{grid-template-columns:repeat(3,1fr)}}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.summary .card{margin:0;padding:10px 14px;min-width:140px;flex:1}
@media(max-width:600px){
  .sale{grid-template-columns:1fr auto}
  .sale .hora{display:none}
  .sale .det{grid-column:1/-1}
  .strip{padding:8px 10px}
  .purple{margin:8px 4px}
  .trip{margin:6px 4px}
  .body{padding:8px 10px}
  .fgrid{grid-template-columns:1fr}
}
/* ---- Densidad escritorio ---- */
main{max-width:1500px;padding:8px 10px;padding-bottom:110px}
.top{padding:8px 12px}
.summary{gap:8px}
.summary .card{padding:7px 12px;min-width:120px;margin:0}
.summary .card>div:nth-child(2){font-size:15px!important}
.card{margin:6px 0}
details>summary{padding:6px 10px;gap:8px}
.dayhead{padding:6px 10px}
.turnhead{padding:6px 10px}
.purple{margin:6px}
.purple>summary{padding:6px 10px}
.trip{margin:5px}
.body{padding:6px 10px}
.strip{padding:5px 10px;gap:6px}
.qbox{font-size:11px;padding:2px 6px;gap:3px}
.stat .k{font-size:10px}
@media(min-width:601px){
  .sale{grid-template-columns:52px minmax(0,1fr) auto auto;padding:5px 10px;gap:8px}
  .sale .det{grid-column:auto;justify-self:end;font-size:11px;order:2}
  .sale .tot{min-width:110px;order:3}
}
/* ---- Edición en planilla ---- */
td.editable{cursor:cell;box-shadow:inset 0 0 0 1px var(--line)}
td.pend{background:rgba(232,130,12,.18)!important;font-weight:700}
.cell-in{width:100%;min-width:90px;padding:3px 6px;min-height:28px;font-size:13px}
#editHint{font-size:12px}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <div class="brand">VM GAS <span>· VISOR PRO</span></div>
    <div class="grow"></div>
    <input type="date" id="fDesde" aria-label="Desde">
    <input type="date" id="fHasta" aria-label="Hasta">
    <button class="primary" id="btnBuscar">Buscar</button>
    <button id="btnTheme" class="ghost" title="Tema">🌙</button>
    <button id="btnVolver" class="ghost" title="Volver">⬅</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnFiltros">Filtros</button>
    <button id="btnDesplegar">▼ Desplegar todo</button>
    <button id="btnContraer">▲ Contraer todo</button>
    <div class="grow"></div>
    <button id="btnCols">Columnas</button>
    <span id="editHint" class="muted" style="display:none">Tocá una celda para editarla</span>
    <button id="btnEditar" title="Editar celdas de la planilla">✎ Editar</button>
    <button id="btnCsv">CSV</button>
  </div>
  <div class="filters" id="panelFiltros">
    <div class="row">
      <input id="fQ" placeholder="Cliente, usuario o N°" style="flex:1;min-width:160px">
      <select id="fTipo"><option value="">Todos los tipos</option></select>
      <select id="fUsr"><option value="">Todos los choferes/usuarios</option></select>
      <button id="btnLimpiarF">Limpiar</button>
    </div>
  </div>
  <div class="tabs">
    <button class="on" data-view="det">Detallada</button>
    <button data-view="pla">Planilla</button>
  </div>
</div>

<main>
  <div class="summary" id="resumenRango"></div>
  <div id="vistaDet"></div>
  <div id="vistaPla" style="display:none"></div>
  <div id="vacio" class="muted" style="text-align:center;padding:40px;display:none">Sin registros en el rango seleccionado.</div>
</main>

<div class="selbar" id="selbar">
  <div id="selTxt" class="num" style="font-size:13px;margin-bottom:8px"></div>
  <div class="row">
    <button class="primary" id="btnCopiar">Copiar selección</button>
    <button id="btnLimpiarSel">Quitar selección</button>
  </div>
</div>

<div class="selbar" id="pendBar">
  <div class="row between">
    <b id="pendTxt"></b>
    <div class="row">
      <button id="pendDescartar">Descartar</button>
      <button class="primary" id="pendGuardar">Guardar cambios</button>
    </div>
  </div>
</div>

<!-- Ficha: ver y editar -->
<div class="modal" id="fichaModal"><div class="sheet">
  <div class="row"><b class="grow" style="font-size:15px">Operación</b><button id="btnCerrarFicha" class="ghost">✖</button></div>
  <div id="fichaBody" style="margin-top:10px"></div>
</div></div>

<!-- Confirmación con PIN -->
<div class="modal" id="confModal"><div class="sheet" style="max-width:480px">
  <div class="row"><b class="grow" id="confTitulo" style="font-size:15px"></b><button id="confX" class="ghost">✖</button></div>
  <div id="confBody" style="margin:10px 0" class="muted"></div>
  <label class="muted" style="display:block;margin-top:8px">Motivo (obligatorio)</label>
  <textarea id="confMotivo" rows="2" style="width:100%"></textarea>
  <label class="muted" style="display:block;margin-top:8px">PIN (dinámico o maestro)</label>
  <input id="confPin" type="password" autocomplete="off" autocapitalize="off" style="width:100%">
  <div class="row" style="margin-top:14px;justify-content:flex-end">
    <button id="confCancelar">Cancelar</button>
    <button id="confOk" class="primary">Confirmar</button>
  </div>
</div></div>

<!-- Columnas -->
<div class="modal" id="colsModal"><div class="sheet">
  <div class="row"><b class="grow">Columnas de la planilla</b><button id="btnCerrarCols" class="ghost">✖</button></div>
  <div class="row" style="margin:10px 0">
    <button id="btnColsBasicas">Básicas</button>
    <button id="btnColsTodas">Todas</button>
  </div>
  <div class="cols-grid" id="colsGrid"></div>
</div></div>

<div class="loader" id="loader">Cargando…</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, doc, getDoc, getDocs, collection, query, where, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCesmFFsn7LvgmcFMWFfi6F5_Zvco79ucM",
  authDomain: "vmgaslr.firebaseapp.com",
  projectId: "vmgaslr",
  storageBucket: "vmgaslr.firebasestorage.app",
  messagingSenderId: "75859850089",
  appId: "1:75859850089:web:fc551c770bbf4ae25803f8"
});
const db = getFirestore(app);

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const SIZES = [10, 15, 45];
const num = v => Number(v) || 0;
const pad2 = n => String(n).padStart(2, '0');
const normU = v => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDay = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-AR');
const fm = n => { n = Math.round(num(n)); return (n < 0 ? '-' : '') + '$' + nf.format(Math.abs(n)); };
const fq = n => nf.format(Math.round(num(n)));
const hm = ms => ms ? new Date(ms).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }) : '--:--';
const diaLabel = ms => ms ? new Date(ms).toLocaleDateString('es-AR') : '';
const qCls = n => num(n) < 0 ? 'neg' : '';

function parseFH(f, h) {
  if (!f) return 0;
  const p = String(f).split('/').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return 0;
  const t = String(h || '0:0:0').split(':').map(Number);
  return new Date(p[2], p[1] - 1, p[0], t[0] || 0, t[1] || 0, t[2] || 0).getTime();
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}
const loader = on => $('loader').classList.toggle('show', !!on);

// ---------- Columnas de la planilla ----------
const COLS = [
  { k: 'usuario', l: 'USUARIO', t: 'txt', def: 1, v: m => m.usuario },
  { k: 'tipo', l: 'TIPO', t: 'txt', def: 1, v: m => m.tipo },
  { k: 'fecha', l: 'FECHA', t: 'txt', def: 1, v: m => m.fecha },
  { k: 'hora', l: 'HORA', t: 'txt', def: 1, v: m => m.hora },
  { k: 'cliente', l: 'CLIENTE', t: 'txt', def: 1, v: m => m.cliente },
  { k: 'L10', l: 'LLENOS 10', t: 'n', def: 1, v: m => m.L[10] },
  { k: 'L15', l: 'LLENOS 15', t: 'n', def: 1, v: m => m.L[15] },
  { k: 'L45', l: 'LLENOS 45', t: 'n', def: 1, v: m => m.L[45] },
  { k: 'total', l: 'TOTAL', t: 'm', def: 1, v: m => m.total },
  { k: 'efe', l: 'EFECTIVO', t: 'm', def: 1, v: m => m.efe },
  { k: 'tra', l: 'TRANSF.', t: 'm', def: 1, v: m => m.tra },
  { k: 'V10', l: 'VACÍOS 10', t: 'n', v: m => m.V[10] },
  { k: 'V15', l: 'VACÍOS 15', t: 'n', v: m => m.V[15] },
  { k: 'V45', l: 'VACÍOS 45', t: 'n', v: m => m.V[45] },
  { k: 'N', l: 'N° operación', t: 'txt', v: m => m.id },
  { k: 'ID_CLIENTE', l: 'ID cliente', t: 'txt', v: m => m.raw.ID_CLIENTE || '' },
  { k: 'idTurno', l: 'ID turno', t: 'txt', v: m => m.turnoId || '' },
  { k: 'idViaje', l: 'ID viaje', t: 'txt', v: m => m.viajeId || '' },
  { k: 'GASTO_TOTAL', l: 'Gasto', t: 'm', v: m => num(m.raw.GASTO_TOTAL) },
  { k: 'COMISION_TOTAL', l: 'Comisión', t: 'm', v: m => num(m.raw.COMISION_TOTAL) },
  { k: 'clienteZona', l: 'Zona', t: 'txt', v: m => m.raw.clienteZona || '' },
  { k: 'clienteCategoria', l: 'Categoría', t: 'txt', v: m => m.raw.clienteCategoria || '' },
  { k: 'operacionEnvase', l: 'Operación envase', t: 'txt', v: m => m.raw.operacionEnvase || '' },
  { k: 'esPagoDeuda', l: 'Cobro deuda', t: 'txt', v: m => m.raw.esPagoDeuda ? 'SÍ' : '' },
  { k: 'esFlotante', l: 'Flotante', t: 'txt', v: m => m.raw.esFlotante ? 'SÍ' : '' },
  { k: 'ventaDesdePlanta', l: 'Retira en planta', t: 'txt', v: m => m.raw.ventaDesdePlanta ? 'SÍ' : '' },
  { k: 'garrafas', l: 'Detalle garrafas', t: 'txt', v: m => m.raw.garrafas || '' }
];
const COL_KEYS = COLS.map(c => c.k);
const colByKey = k => COLS.find(c => c.k === k);
const visibleCols = () => S.cols.map(colByKey).filter(Boolean);

// Campos editables de una operación
const EDITABLE = [
  { k: 'USUARIO', l: 'Usuario', t: 'txt' },
  { k: 'C', l: 'Cliente', t: 'txt' },
  { k: 'TIPO', l: 'Tipo', t: 'txt' },
  { k: 'FECHA', l: 'Fecha (dd/mm/aaaa)', t: 'txt' },
  { k: 'HORA', l: 'Hora (hh:mm:ss)', t: 'txt' },
  { k: 'ALL10', l: 'Llenos 10', t: 'int' },
  { k: 'ALL15', l: 'Llenos 15', t: 'int' },
  { k: 'ALL45', l: 'Llenos 45', t: 'int' },
  { k: 'AV10', l: 'Vacíos 10', t: 'int' },
  { k: 'AV15', l: 'Vacíos 15', t: 'int' },
  { k: 'AV45', l: 'Vacíos 45', t: 'int' },
  { k: 'TOTAL', l: 'Total $', t: 'int' },
  { k: 'E$', l: 'Efectivo $', t: 'int' },
  { k: 'T$', l: 'Transferencia $', t: 'int' }
];

// ---------- Estado ----------
const S = {
  view: 'det',
  usuarioSesion: 'SISTEMA',
  cols: [],
  sel: new Set(),
  sort: { k: 'ms', dir: -1 },
  f: { q: '', tipo: '', usr: '' },
  ventas: [],
  dias: [],
  byId: new Map(),
  actual: null,
  accion: null,
  editMode: false,
  pend: new Map()
};

// ---------- Sesión ----------
let TOKEN = new URLSearchParams(location.search).get('k') || sessionStorage.getItem('k');
if (!TOKEN) { location.replace('inicio.html'); throw new Error('Sin sesión'); }
sessionStorage.setItem('k', TOKEN);
history.replaceState({}, document.title, location.pathname);

async function validarSesion() {
  try {
    const s = await getDoc(doc(db, 'tokens', TOKEN));
    const d = s.exists() ? s.data() : null;
    if (!d || (d.expira && Date.now() > d.expira)) { location.replace('inicio.html'); return false; }
    S.usuarioSesion = d.usuario || 'SISTEMA';
    return true;
  } catch (e) {
    console.error(e);
    toast('Error de conexión al validar la sesión');
    return false;
  }
}

// ---------- Carga y modelo ----------
function diasStrings(d1, fin) {
  const out = [];
  for (let t = d1.getTime(); t <= fin; t += 86400000) {
    const d = new Date(t);
    const a = `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    const b = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
    out.push(a);
    if (b !== a) out.push(b);
  }
  return out;
}

const emptyT = () => ({ n: 0, tot: 0, efe: 0, tra: 0, L: { 10: 0, 15: 0, 45: 0 }, V: { 10: 0, 15: 0, 45: 0 } });
function sumar(list) {
  const t = emptyT();
  list.forEach(v => {
    t.n++; t.tot += v.total; t.efe += v.efe; t.tra += v.tra;
    SIZES.forEach(k => { t.L[k] += v.L[k]; t.V[k] += v.V[k]; });
  });
  return t;
}

async function cargar() {
  if (S.pend.size && !confirm('Hay cambios sin guardar en la planilla. ¿Descartarlos y cambiar de rango?')) return;
  const d1 = parseDay($('fDesde').value), d2 = parseDay($('fHasta').value);
  if (!d1 || !d2 || d2 < d1) return toast('Rango de fechas inválido');
  if ((d2 - d1) / 86400000 + 1 > 62) return toast('El rango máximo es de 62 días');

  const ini = d1.getTime();
  const fin = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate(), 23, 59, 59, 999).getTime();
  const dias = diasStrings(d1, fin);

  loader(true);
  try {
    const [uSnap, tSnap, tAbSnap, cSnap] = await Promise.all([
      getDocs(collection(db, 'usuarios')),
      getDocs(query(collection(db, 'turnos'), where('timestampAperturaMs', '>=', ini - 2 * 86400000), where('timestampAperturaMs', '<=', fin))),
      getDocs(query(collection(db, 'turnos'), where('estado', '==', 'ABIERTO'))),
      getDocs(query(collection(db, 'ccarga'), where('timestampMs', '>=', ini), where('timestampMs', '<=', fin)))
    ]);

    const mapU = {};
    uSnap.forEach(x => {
      const u = x.data();
      [x.id, u.nombre_mostrar, u.nombre_completo].forEach(v => { if (v) mapU[normU(v)] = normU(x.id); });
    });

    const turnos = new Map();
    [...tSnap.docs, ...tAbSnap.docs].forEach(x => {
      if (turnos.has(x.id)) return;
      const t = x.data();
      turnos.set(x.id, {
        ...t, id: x.id,
        ap: num(t.timestampAperturaMs),
        ce: t.timestampCierreMs ? num(t.timestampCierreMs) : Infinity,
        open: t.estado === 'ABIERTO',
        ini: t.ini || null,
        fin: t.fin || null
      });
    });
    const turnoEnMs = ms => {
      let r = null;
      turnos.forEach(t => { if (ms >= t.ap - 60000 && ms <= t.ce && (!r || t.ap > r.ap)) r = t; });
      return r;
    };

    const trips = cSnap.docs.map(x => {
      const r = x.data();
      const open = ['EN_RUTA', 'COMPRA_EN_RUTA'].includes(r.estado);
      const hasLl = SIZES.some(k => r[`lL${k}`] !== undefined || r[`lV${k}`] !== undefined);
      const llegMs = num(r.timestampLlegadaMs || r.timestampCierreMs) || (r.fechaLlegada ? parseFH(r.fechaLlegada, r.horaLlegada) : 0) || null;
      const sL = {}, sV = {}, lL = {}, lV = {};
      SIZES.forEach(k => {
        sL[k] = num(r[`sL${k}`]); sV[k] = num(r[`sV${k}`]);
        lL[k] = num(r[`lL${k}`]); lV[k] = num(r[`lV${k}`]);
      });
      return {
        id: x.id,
        idViaje: r.idViaje || x.id,
        idTurno: r.idTurno || null,
        chofer: normU(r.chofer),
        choferNombre: r.chofer || '',
        estado: r.estado || '',
        tipo: r.tipoViaje || 'REPARTO',
        ms: num(r.timestampMs),
        llegMs,
        open,
        usaExp: open || !hasLl,
        sL, sV, lL, lV,
        ventas: [],
        turnoId: null
      };
    });

    const movsRaw = [];
    for (let i = 0; i < dias.length; i += 30) {
      const snap = await getDocs(query(collection(db, 'movimientos'), where('FECHA', 'in', dias.slice(i, i + 30))));
      snap.forEach(x => movsRaw.push({ id: x.id, r: x.data() }));
    }

    const ventas = movsRaw.map(({ id, r }) => {
      const L = {}, V = {};
      SIZES.forEach(k => {
        L[k] = num(r[`ALL${k}`]);
        V[k] = num(r[`AV${k}`]) + (r.esPagoDeuda ? num(r[`dev${k}`]) : 0);
      });
      return {
        id, raw: r,
        ms: parseFH(r.FECHA, r.HORA),
        fecha: r.FECHA || '',
        hora: String(r.HORA || ''),
        usuario: r.USUARIO || '',
        chofer: mapU[normU(r.USUARIO)] || normU(r.USUARIO),
        tipo: r.TIPO || '',
        cliente: r.C || r.clienteNombre || '',
        total: num(r.TOTAL),
        efe: num(r['E$']),
        tra: num(r['T$']),
        L, V,
        idViaje: r.idViaje || r.ID_VIAJE || null,
        idTurno: r.idTurno || r.ID_TURNO || null,
        viajeId: null,
        turnoId: null
      };
    }).filter(v => v.ms >= ini && v.ms <= fin);

    // Ventas -> viaje (por ID o por chofer y ventana horaria)
    ventas.forEach(v => {
      let t = null;
      if (v.idViaje) t = trips.find(x => x.idViaje === v.idViaje) || null;
      if (!t) {
        trips.forEach(x => {
          if (x.chofer !== v.chofer) return;
          const lim = x.llegMs ? x.llegMs + 60000 : (x.open ? Infinity : x.ms + 12 * 3600000);
          if (v.ms >= x.ms - 60000 && v.ms <= lim && (!t || x.ms > t.ms)) t = x;
        });
      }
      if (t) { v.viajeId = t.idViaje; t.ventas.push(v); }
    });

    // Viaje -> turno
    trips.forEach(t => {
      const tn = (t.idTurno && turnos.get(t.idTurno)) || turnoEnMs(t.ms);
      t.turnoId = tn ? tn.id : null;
    });

    // Venta -> turno
    ventas.forEach(v => {
      if (v.viajeId) {
        const tr = trips.find(x => x.idViaje === v.viajeId);
        v.turnoId = tr ? tr.turnoId : null;
        return;
      }
      const tn = (v.idTurno && turnos.get(v.idTurno)) || turnoEnMs(v.ms);
      v.turnoId = tn ? tn.id : null;
    });

    // Lo que tiene que haber en cada viaje
    trips.forEach(t => {
      const sumL = {}, sumV = {};
      SIZES.forEach(k => { sumL[k] = 0; sumV[k] = 0; });
      t.ventas.forEach(v => SIZES.forEach(k => { sumL[k] += v.L[k]; sumV[k] += v.V[k]; }));
      t.exp = { L: {}, V: {} };
      SIZES.forEach(k => {
        t.exp.L[k] = t.usaExp ? t.sL[k] - sumL[k] : t.lL[k];
        t.exp.V[k] = t.usaExp ? t.sV[k] + sumV[k] : t.lV[k];
      });
    });

    // Grupos por turno
    const grupos = new Map();
    const grupo = id => {
      const k = id || '__sin';
      if (!grupos.has(k)) grupos.set(k, { key: k, turno: id ? turnos.get(id) : null, viajes: [], sueltas: [], stock: null });
      return grupos.get(k);
    };
    turnos.forEach(t => { if (t.ap <= fin && (t.open || t.ce >= ini)) grupo(t.id); });
    trips.forEach(t => grupo(t.turnoId).viajes.push(t));
    ventas.forEach(v => { if (!v.viajeId) grupo(v.turnoId).sueltas.push(v); });

    // Stock teórico por turno (misma lógica que controlstock)
    grupos.forEach(g => {
      const t = g.turno;
      if (!t) return;
      const tot = { L: {}, V: {} }, calle = { L: {}, V: {} };
      SIZES.forEach(k => {
        tot.L[k] = num(t.ini?.[`l${k}`]); tot.V[k] = num(t.ini?.[`v${k}`]);
        calle.L[k] = 0; calle.V[k] = 0;
      });
      g.viajes.forEach(x => SIZES.forEach(k => {
        tot.L[k] += x.exp.L[k] - x.sL[k];
        tot.V[k] += x.exp.V[k] - x.sV[k];
        if (x.open) { calle.L[k] += x.exp.L[k]; calle.V[k] += x.exp.V[k]; }
      }));
      g.sueltas.forEach(v => SIZES.forEach(k => { tot.L[k] -= v.L[k]; tot.V[k] += v.V[k]; }));
      const plat = { L: {}, V: {} };
      SIZES.forEach(k => { plat.L[k] = tot.L[k] - calle.L[k]; plat.V[k] = tot.V[k] - calle.V[k]; });
      g.stock = { tot, calle, plat };
    });

    // Días: turnos agrupados por fecha de apertura; "sin turno" al final
    const porDia = new Map();
    [...grupos.values()].forEach(g => {
      const k = g.turno ? diaLabel(g.turno.ap) : '__sin';
      if (!porDia.has(k)) porDia.set(k, { key: k, label: g.turno ? k : 'SIN TURNO', ms: g.turno ? g.turno.ap : 0, grupos: [] });
      porDia.get(k).grupos.push(g);
    });
    const diasOrdenados = [...porDia.values()].sort((a, b) => {
      if (a.key === '__sin') return 1;
      if (b.key === '__sin') return -1;
      return b.ms - a.ms;
    });
    diasOrdenados.forEach(d => d.grupos.sort((a, b) => {
      if (!a.turno) return 1;
      if (!b.turno) return -1;
      return a.turno.ap - b.turno.ap;
    }));

    S.dias = diasOrdenados;
    S.ventas = ventas;
    S.byId = new Map(ventas.map(v => [v.id, v]));
    S.sel.clear();
    cargarFiltros();
    renderAll();
  } catch (e) {
    console.error(e);
    toast('Error al cargar: ' + (e.code || e.message));
  } finally {
    loader(false);
  }
}

// ---------- Filtros ----------
function fOk(v) {
  const f = S.f;
  if (f.tipo && v.tipo !== f.tipo) return false;
  if (f.usr && v.chofer !== f.usr) return false;
  if (f.q && !`${v.cliente} ${v.usuario} ${v.id}`.toLowerCase().includes(f.q.toLowerCase())) return false;
  return true;
}
const filtrosActivos = () => !!(S.f.q || S.f.tipo || S.f.usr);

function cargarFiltros() {
  const tipos = [...new Set(S.ventas.map(v => v.tipo).filter(Boolean))].sort();
  const usr = new Map();
  S.ventas.forEach(v => { if (v.chofer && !usr.has(v.chofer)) usr.set(v.chofer, v.usuario); });
  const selT = $('fTipo'), selU = $('fUsr');
  const prevT = S.f.tipo, prevU = S.f.usr;
  selT.innerHTML = '<option value="">Todos los tipos</option>' + tipos.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  selU.innerHTML = '<option value="">Todos los choferes/usuarios</option>' + [...usr].map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join('');
  selT.value = tipos.includes(prevT) ? prevT : '';
  selU.value = usr.has(prevU) ? prevU : '';
  S.f.tipo = selT.value; S.f.usr = selU.value;
}

// ---------- Componentes visuales ----------
function qbox(label, l, v) {
  return `<span class="qbox"><span class="muted">${label}</span> <b class="${qCls(l)}">${fq(l)}</b><span class="sep">|</span><b class="o ${qCls(v)}">${fq(v)}</b></span>`;
}
const estadoPill = open => open ? '<span class="pill p-live">● EN VIVO</span>' : '<span class="pill p-closed">CERRADO</span>';

function stripLV(titulo, cls, o) {
  return `<span class="lbl ${cls}">${titulo}</span>` + SIZES.map(k => qbox(k, o.L[k], o.V[k])).join('');
}

function ventaHtml(v) {
  const llenos = SIZES.filter(k => v.L[k] || v.V[k]).map(k => `<span class="pill p-tag">${k}kg ${fq(v.L[k])}L/${fq(v.V[k])}V</span>`).join('');
  const pagos = [v.efe ? `Efe <b>${fm(v.efe)}</b>` : '', v.tra ? `Transf <b>${fm(v.tra)}</b>` : ''].filter(Boolean).join(' · ');
  return `<div class="sale" data-venta="${esc(v.id)}">
    <span class="hora">${esc(v.hora.slice(0, 5))}</span>
    <span class="cli">${esc(v.cliente || '—')} <span class="muted">· ${esc(v.usuario)}</span></span>
    <span class="tot num">${fm(v.total)}</span>
    <div class="det">${llenos}${pagos ? `<span>${pagos}</span>` : ''}</div>
  </div>`;
}

function totalesHtml(t) {
  return `<span class="stat"><span class="k">Ventas</span><b>${t.n}</b></span>
    <span class="stat"><span class="k">Efectivo</span><b class="money">${fm(t.efe)}</b></span>
    <span class="stat"><span class="k">Transf.</span><b class="money blue">${fm(t.tra)}</b></span>
    <span class="stat"><span class="k">Total</span><b class="money">${fm(t.tot)}</b></span>`;
}

// Viaje: salida, llegada real o estimada, ventas del viaje
function viajeHtml(x, vs) {
  const t = sumar(vs);
  const estado = x.open ? '<span class="pill p-route">EN RUTA</span>' : '<span class="pill p-done">FINALIZADO</span>';
  const etiquetaLlegada = x.open ? 'ESTIMADO' : 'LLEGADA';
  return `<details class="trip">
    <summary>
      <span>🚚 <b>${esc(x.tipo)}: ${esc(x.idViaje)}</b></span>
      <span class="muted">S: ${hm(x.ms)} / L: ${x.open ? '--:--' : hm(x.llegMs)}</span>
      ${estado}
      <span class="grow"></span>
      <span class="muted">${t.n} ops</span>
      <span class="money num">TOT: ${fm(t.tot)}</span>
    </summary>
    <div class="body">
      <div class="strip" style="border:0;padding:0 0 8px">${stripLV('SALIDA', 'l-ini', { L: x.sL, V: x.sV })}</div>
      <div class="strip" style="border:0;padding:0 0 10px">${stripLV(etiquetaLlegada, 'l-fin', { L: x.exp.L, V: x.exp.V })}</div>
      <div class="strip" style="border:0;padding:6px 0 4px">${totalesHtml(t)}</div>
      ${vs.map(ventaHtml).join('') || '<div class="muted" style="padding:10px">Sin ventas en este viaje</div>'}
    </div>
  </details>`;
}

// Chofer: agrupa sus viajes dentro del turno
function choferHtml(nombre, viajes) {
  const t = sumar(viajes.flatMap(o => o.vs));
  return `<details class="purple" open>
    <summary>👤 CHOFER: ${esc(nombre)}
      <span class="grow"></span>
      <span class="muted">Viajes: ${viajes.length}</span>
      <span class="muted">Ops: ${t.n}</span>
      <span class="money num">Recaudación: ${fm(t.tot)}</span>
    </summary>
    <div style="padding:4px 0 8px">
      <div class="strip" style="border:0;padding:0 14px 6px">${totalesHtml(t)}</div>
      ${viajes.map(o => viajeHtml(o.x, o.vs)).join('')}
    </div>
  </details>`;
}

// Sin camión: agrupado por usuario
function sinCamionHtml(sueltas) {
  const porUsr = new Map();
  sueltas.forEach(v => {
    if (!porUsr.has(v.usuario)) porUsr.set(v.usuario, []);
    porUsr.get(v.usuario).push(v);
  });
  const t = sumar(sueltas);
  const bloques = [...porUsr].map(([usr, vs]) => {
    const tu = sumar(vs);
    return `<details class="trip" open>
      <summary>🏪 <b>${esc(usr)}</b> <span class="grow"></span> <span class="muted">${tu.n} ops</span>
        <span class="money num">Efe ${fm(tu.efe)}</span><span class="money blue num">Transf ${fm(tu.tra)}</span><span class="money num">TOT ${fm(tu.tot)}</span>
      </summary>
      <div class="body">${vs.map(ventaHtml).join('')}</div>
    </details>`;
  }).join('');
  return `<details class="purple" style="border-color:var(--blue);background:transparent" open>
    <summary style="color:var(--blue)">🏪 SIN CAMIÓN <span class="grow"></span>
      <span class="muted">Ops: ${t.n}</span><span class="money num">TOT: ${fm(t.tot)}</span></summary>
    <div style="padding:4px 0 8px">${bloques}</div>
  </details>`;
}

function turnoHtml(g, viajes, sueltas) {
  const t = g.turno;
  const tt = sumar([...viajes.flatMap(o => o.vs), ...sueltas]);

  let cab;
  if (t) {
    cab = `<summary class="turnhead ${t.open ? '' : 'closed'}">
      <span>TURNO: <b>${esc(t.id)}</b></span>
      ${estadoPill(t.open)}
      <span class="grow"></span>
      <span class="muted">Apertura: ${hm(t.ap)}${t.open ? '' : ' · Cierre: ' + hm(t.ce)}</span>
    </summary>`;
  } else {
    cab = `<summary class="turnhead closed" style="border-left-color:var(--orange)">
      <span><b>SIN TURNO</b></span><span class="grow"></span><span class="muted">Viajes y ventas fuera de turno</span>
    </summary>`;
  }

  let stock = '';
  if (t && g.stock) {
    const aper = { L: {}, V: {} };
    SIZES.forEach(k => { aper.L[k] = num(t.ini?.[`l${k}`]); aper.V[k] = num(t.ini?.[`v${k}`]); });
    let cierre = null;
    if (!t.open && t.fin) {
      cierre = { L: {}, V: {} };
      SIZES.forEach(k => { cierre.L[k] = num(t.fin[`l${k}`]); cierre.V[k] = num(t.fin[`v${k}`]); });
    }
    stock = `<div class="strip">${stripLV('APERTURA', 'l-ini', aper)}</div>
      <div class="strip">${cierre ? stripLV('CIERRE', 'l-fin', cierre) : stripLV('TEÓRICO', 'l-tot', g.stock.tot)}</div>
      <div class="strip">${stripLV('EN CALLE', 'l-tot', g.stock.calle)}</div>
      <div class="strip">${stripLV('PLATAFORMA', 'l-ini', g.stock.plat)}</div>`;
  }

  const caja = `<div class="strip" style="background:var(--bg)">
      <span class="lbl" style="color:var(--dim)">CAJA TURNO</span>
      <span class="stat"><span class="k">Efectivo</span><b class="money">${fm(tt.efe)}</b></span>
      <span class="stat"><span class="k">Transf.</span><b class="money blue">${fm(tt.tra)}</b></span>
      <span class="stat"><span class="k">Recaudación</span><b class="money">${fm(tt.tot)}</b></span>
      <span class="stat"><span class="k">Ops</span><b>${tt.n}</b></span>
    </div>`;

  const porChofer = new Map();
  viajes.forEach(o => {
    const k = o.x.chofer;
    if (!porChofer.has(k)) porChofer.set(k, { nombre: o.x.choferNombre || o.x.chofer, viajes: [] });
    porChofer.get(k).viajes.push(o);
  });
  const choferes = [...porChofer.values()].map(c => choferHtml(c.nombre, c.viajes)).join('');
  const sueltasHtml = sueltas.length ? sinCamionHtml(sueltas) : '';
  const vacio = !viajes.length && !sueltas.length ? '<div class="muted" style="padding:12px">Sin movimientos</div>' : '';

  return `<details class="card" open>${cab}${stock}${caja}
    <div style="padding-bottom:8px">${choferes}${sueltasHtml}${vacio}</div>
  </details>`;
}

function renderDet() {
  const activo = filtrosActivos();
  let html = '';
  S.dias.forEach(d => {
    const bloques = [];
    d.grupos.forEach(g => {
      const viajes = g.viajes.map(x => ({ x, vs: x.ventas.filter(fOk) })).filter(o => !activo || o.vs.length);
      const sueltas = g.sueltas.filter(fOk);
      if (activo && !viajes.length && !sueltas.length) return;
      bloques.push(turnoHtml(g, viajes, sueltas));
    });
    if (!bloques.length) return;
    const td = sumar(d.grupos.flatMap(g => [...g.viajes.flatMap(x => x.ventas), ...g.sueltas]).filter(fOk));
    html += `<details class="card" open>
      <summary class="dayhead">📅 <b>${esc(d.label)}</b>
        <span class="grow"></span>
        ${totalesHtml(td)}
      </summary>
      <div style="padding:6px 6px 10px">${bloques.join('')}</div>
    </details>`;
  });
  $('vistaDet').innerHTML = html;
}

// ---------- Planilla ----------
const valorCelda = (c, v) => { const p = S.pend.get(v.id); return p && c.k in p ? p[c.k] : c.v(v); };

function celdaHtml(c, v, i) {
  const p = S.pend.get(v.id);
  const pendiente = !!(p && c.k in p);
  const val = valorCelda(c, v);
  const txt = c.t === 'm' ? fm(val) : c.t === 'n' ? fq(val) : esc(val);
  const editable = !!EDIT_MAP[c.k];
  const cls = [c.t !== 'txt' ? 'r num' : '', i === 0 ? 'sticky' : '', pendiente ? 'pend' : '', editable && S.editMode ? 'editable' : ''].join(' ');
  const data = editable ? ` data-edit="${c.k}" data-id="${esc(v.id)}"` : '';
  return `<td class="${cls}"${data}>${txt}</td>`;
}

function ordenar(a, b) {
  const c = S.sort.k === 'ms' ? null : colByKey(S.sort.k);
  const va = c ? c.v(a) : a.ms, vb = c ? c.v(b) : b.ms;
  if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * S.sort.dir;
  return String(va).localeCompare(String(vb), 'es') * S.sort.dir;
}

function renderPla() {
  const cols = visibleCols();
  const rows = S.ventas.filter(fOk).sort(ordenar);
  const sumas = {};
  cols.forEach(c => { if (c.t !== 'txt') sumas[c.k] = rows.reduce((a, v) => a + (Number(valorCelda(c, v)) || 0), 0); });

  const th = cols.map((c, i) => {
    const flecha = S.sort.k === c.k || (S.sort.k === 'ms' && (c.k === 'fecha' || c.k === 'hora'))
      ? (S.sort.dir > 0 ? ' ▲' : ' ▼') : '';
    return `<th data-sort="${c.k}" class="${c.t !== 'txt' ? 'r' : ''} ${i === 0 ? 'sticky' : ''}">${c.l}${flecha}</th>`;
  }).join('');

  const body = rows.map(v => `<tr data-venta="${esc(v.id)}" class="${S.sel.has(v.id) ? 'sel' : ''}">
    ${cols.map((c, i) => celdaHtml(c, v, i)).join('')}
    <td><button class="ghost" data-ficha="${esc(v.id)}" title="Ver / editar">⋯</button></td>
  </tr>`).join('');

  const pie = cols.map((c, i) => {
    if (i === 0) return `<td class="sticky">TOTAL (${rows.length})</td>`;
    if (c.t === 'txt') return '<td></td>';
    return `<td class="r num">${c.t === 'm' ? fm(sumas[c.k]) : fq(sumas[c.k])}</td>`;
  }).join('');

  $('vistaPla').innerHTML = `<div class="tbl-wrap"><table>
    <thead><tr>${th}<th></th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr>${pie}<td></td></tr></tfoot>
  </table></div>`;
}

// ---------- Edición en planilla ----------
const EDIT_MAP = {
  usuario: { f: 'USUARIO', t: 'txt', l: 'USUARIO' },
  tipo: { f: 'TIPO', t: 'txt', l: 'TIPO' },
  fecha: { f: 'FECHA', t: 'txt', l: 'FECHA' },
  hora: { f: 'HORA', t: 'txt', l: 'HORA' },
  cliente: { f: 'C', t: 'txt', l: 'CLIENTE' },
  L10: { f: 'ALL10', t: 'int', l: 'LLENOS 10' },
  L15: { f: 'ALL15', t: 'int', l: 'LLENOS 15' },
  L45: { f: 'ALL45', t: 'int', l: 'LLENOS 45' },
  V10: { f: 'AV10', t: 'int', l: 'VACÍOS 10' },
  V15: { f: 'AV15', t: 'int', l: 'VACÍOS 15' },
  V45: { f: 'AV45', t: 'int', l: 'VACÍOS 45' },
  total: { f: 'TOTAL', t: 'int', l: 'TOTAL' },
  efe: { f: 'E$', t: 'int', l: 'EFECTIVO' },
  tra: { f: 'T$', t: 'int', l: 'TRANSF.' }
};

function setPend(id, k, raw) {
  const meta = EDIT_MAP[k], v = S.byId.get(id);
  const texto = String(raw ?? '').trim();
  if (meta.t === 'int' && !/^\d*$/.test(texto)) { toast('Ingrese solo números'); return; }
  const nuevo = meta.t === 'int' ? num(texto) : texto;
  const original = meta.t === 'int' ? num(v.raw[meta.f]) : String(v.raw[meta.f] ?? '');
  const p = { ...(S.pend.get(id) || {}) };
  if (nuevo === original) delete p[k]; else p[k] = nuevo;
  if (Object.keys(p).length) S.pend.set(id, p); else S.pend.delete(id);
}

function abrirEdicionCelda(td) {
  if (td.querySelector('input')) return;
  const id = td.dataset.id, k = td.dataset.edit;
  const v = S.byId.get(id);
  if (!v) return;
  const meta = EDIT_MAP[k];
  td.innerHTML = `<input class="cell-in" value="${esc(valorCelda(colByKey(k), v))}" ${meta.t === 'int' ? 'inputmode="numeric" pattern="[0-9]*"' : ''}>`;
  const inp = td.querySelector('input');
  inp.focus(); inp.select();
  let cerrado = false;
  const cerrar = guardar => {
    if (cerrado) return;
    cerrado = true;
    if (guardar) setPend(id, k, inp.value);
    renderPla();
    renderSel();
  };
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); cerrar(true); }
    if (e.key === 'Escape') cerrar(false);
  });
  inp.addEventListener('blur', () => cerrar(true));
}

function renderPendBar() {
  const n = [...S.pend.values()].reduce((a, p) => a + Object.keys(p).length, 0);
  $('pendBar').classList.toggle('show', n > 0);
  $('pendTxt').textContent = `${n} cambio(s) en ${S.pend.size} operación(es) sin guardar`;
}

function guardarPendientes() {
  const filas = [];
  S.pend.forEach((p, id) => {
    const v = S.byId.get(id);
    Object.entries(p).forEach(([k, nuevo]) => {
      const meta = EDIT_MAP[k];
      filas.push({
        id, k, f: meta.f, t: meta.t, label: meta.l,
        antes: meta.t === 'int' ? num(v.raw[meta.f]) : String(v.raw[meta.f] ?? ''),
        despues: nuevo,
        operacion: `${v.fecha} ${v.hora.slice(0, 5)} · ${v.cliente || '—'}`
      });
    });
  });
  if (!filas.length) return;
  const cuerpo = `<div style="max-height:40vh;overflow:auto"><table style="width:100%;font-size:12px">
    <thead><tr><th style="text-align:left">Operación</th><th style="text-align:left">Campo</th><th style="text-align:right">Antes</th><th style="text-align:right">Después</th></tr></thead>
    <tbody>${filas.map(r => `<tr><td>${esc(r.operacion)}</td><td>${esc(r.label)}</td><td class="r">${esc(r.antes)}</td><td class="r"><b>${esc(r.despues)}</b></td></tr>`).join('')}</tbody>
    </table></div>`;
  pedirConfirmacion({
    titulo: `Confirmar ${filas.length} cambio(s)`,
    cuerpo,
    onOk: async (motivo, pinTipo) => {
      const porDoc = new Map();
      filas.forEach(r => {
        if (!porDoc.has(r.id)) porDoc.set(r.id, {});
        porDoc.get(r.id)[r.f] = r.t === 'int' ? num(r.despues) : r.despues;
      });
      const batch = writeBatch(db);
      porDoc.forEach((datos, id) => batch.update(doc(db, 'movimientos', id), datos));
      batch.set(doc(collection(db, 'auditoria')), {
        tipo: 'EDITAR_PLANILLA', usuario: S.usuarioSesion, pinTipo, motivo,
        cambios: filas.map(r => ({ movId: r.id, campo: r.f, antes: r.antes, despues: r.despues })),
        fecha_hora: serverTimestamp()
      });
      await batch.commit();
      S.pend.clear();
    }
  });
}

// ---------- Resumen del rango ----------
function renderResumen() {
  const t = sumar(S.ventas.filter(fOk));
  const viajes = S.dias.flatMap(d => d.grupos.flatMap(g => g.viajes))
    .filter(x => !filtrosActivos() || x.ventas.some(fOk)).length;
  $('resumenRango').innerHTML = `
    <div class="card"><div class="muted">Total del rango</div><div class="money" style="font-size:18px">${fm(t.tot)}</div></div>
    <div class="card"><div class="muted">Efectivo</div><div class="money" style="font-size:18px">${fm(t.efe)}</div></div>
    <div class="card"><div class="muted">Transferencia</div><div class="money blue" style="font-size:18px">${fm(t.tra)}</div></div>
    <div class="card"><div class="muted">Operaciones</div><div style="font-size:18px;font-weight:800">${t.n}</div></div>
    <div class="card"><div class="muted">Viajes</div><div style="font-size:18px;font-weight:800">${viajes}</div></div>`;
}

function renderAll() {
  const enDet = S.view === 'det';
  renderResumen();
  if (enDet) renderDet(); else renderPla();
  $('vistaDet').style.display = enDet ? 'block' : 'none';
  $('vistaPla').style.display = enDet ? 'none' : 'block';
  $('vacio').style.display = S.ventas.length || S.dias.length ? 'none' : 'block';
  renderSel();
}

// ---------- Selección ----------
function toggleSel(id) {
  if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
  renderPla();
  renderSel();
}

function renderSel() {
  renderPendBar();
  const vs = [...S.sel].map(id => S.byId.get(id)).filter(Boolean);
  $('selbar').classList.toggle('show', vs.length > 0);
  if (!vs.length) return;
  const t = sumar(vs);
  $('selTxt').innerHTML = `<b>${t.n}</b> seleccionadas · Total <b>${fm(t.tot)}</b> · Efe ${fm(t.efe)} · Transf ${fm(t.tra)}<br>
    Llenos: ${SIZES.map(k => `${k}kg ${fq(t.L[k])}`).join(' · ')}`;
}

// ---------- Confirmación con PIN ----------
function pedirConfirmacion({ titulo, cuerpo, motivoObligatorio = true, onOk }) {
  S.accion = onOk;
  $('confTitulo').textContent = titulo;
  $('confBody').innerHTML = cuerpo;
  $('confMotivo').value = '';
  $('confPin').value = '';
  $('confMotivo').style.display = motivoObligatorio ? 'block' : 'none';
  $('confModal').classList.add('show');
  setTimeout(() => $('confPin').focus(), 50);
}
const cerrarConf = () => { $('confModal').classList.remove('show'); S.accion = null; };

async function verificarPin(pin) {
  const p = String(pin ?? '').trim().toLowerCase();
  if (!p) return null;
  const snap = await getDoc(doc(db, 'seguridad', 'pin'));
  if (!snap.exists()) return null;
  const d = snap.data();
  if (p === String(d.dinamico ?? '').trim().toLowerCase()) return 'DINAMICO';
  if (d.maestro && p === String(d.maestro).trim().toLowerCase()) return 'MAESTRO';
  return null;
}

// ---------- Editar / eliminar ----------
function abrirFicha(id) {
  const v = S.byId.get(id);
  if (!v) return;
  S.actual = v;
  const campos = EDITABLE.map(c => `
    <label>${c.l}
      <input data-f="${c.k}" data-t="${c.t}" value="${esc(v.raw[c.k] ?? (c.t === 'int' ? 0 : ''))}" ${c.t === 'int' ? 'inputmode="numeric" pattern="[0-9]*"' : ''}>
    </label>`).join('');
  const sistema = Object.entries(v.raw)
    .filter(([k]) => !EDITABLE.some(c => c.k === k) && k !== 'pin')
    .map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val !== null && typeof val === 'object' ? JSON.stringify(val) : val)}</dd>`).join('');
  $('fichaBody').innerHTML = `
    <div class="row" style="margin-bottom:8px">
      <span class="pill p-tag">${esc(v.tipo)}</span>
      <span class="muted">N° ${esc(v.id)}</span>
      <span class="muted">Viaje: ${esc(v.viajeId || 'sin camión')} · Turno: ${esc(v.turnoId || 'sin turno')}</span>
    </div>
    <div class="fgrid">${campos}</div>
    <div class="warnbox" id="avisoCambios" style="display:none">Cambios sin guardar. Al guardar se pide PIN y motivo. El saldo de clientes no se recalcula.</div>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button id="btnEliminar" style="color:var(--red);border-color:var(--red)">🗑 Eliminar operación</button>
      <button id="btnGuardar" class="primary" disabled>Guardar cambios</button>
    </div>
    <details style="margin-top:12px"><summary style="padding:8px 0">Campos del sistema (solo lectura)</summary>
      <dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0">${sistema}</dl></details>`;
  $('fichaModal').classList.add('show');
  $('fichaBody').querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', recalcularCambios));
  $('btnGuardar').addEventListener('click', guardarCambios);
  $('btnEliminar').addEventListener('click', eliminarOperacion);
}

function cambiosActuales() {
  const v = S.actual, cambios = [];
  $('fichaBody').querySelectorAll('[data-f]').forEach(inp => {
    const k = inp.dataset.f, t = inp.dataset.t;
    const original = t === 'int' ? num(v.raw[k]) : String(v.raw[k] ?? '');
    const nuevo = t === 'int' ? num(inp.value) : String(inp.value).trim();
    const changed = original !== nuevo;
    inp.classList.toggle('changed', changed);
    if (changed) cambios.push({ k, t, antes: original, despues: nuevo, label: EDITABLE.find(c => c.k === k)?.l || k });
  });
  return cambios;
}

function recalcularCambios() {
  const c = cambiosActuales();
  $('btnGuardar').disabled = c.length === 0;
  $('avisoCambios').style.display = c.length ? 'block' : 'none';
}

function guardarCambios() {
  const cambios = cambiosActuales();
  if (!cambios.length) return;
  const cuerpo = `<table style="width:100%;font-size:13px"><thead><tr><th style="text-align:left">Campo</th><th style="text-align:right">Antes</th><th style="text-align:right">Después</th></tr></thead><tbody>
    ${cambios.map(c => `<tr><td>${esc(c.label)}</td><td class="r">${esc(c.antes)}</td><td class="r"><b>${esc(c.despues)}</b></td></tr>`).join('')}
    </tbody></table>`;
  const movId = S.actual.id;
  pedirConfirmacion({
    titulo: 'Confirmar modificación',
    cuerpo,
    onOk: async (motivo, pinTipo) => {
      const datos = {};
      cambios.forEach(c => { datos[c.k] = c.t === 'int' ? num(c.despues) : c.despues; });
      const batch = writeBatch(db);
      batch.update(doc(db, 'movimientos', movId), datos);
      batch.set(doc(collection(db, 'auditoria')), {
        tipo: 'EDITAR', movId, usuario: S.usuarioSesion, pinTipo, motivo,
        cambios: cambios.map(c => ({ campo: c.k, antes: c.antes, despues: c.despues })),
        fecha_hora: serverTimestamp()
      });
      await batch.commit();
    }
  });
}

function eliminarOperacion() {
  const v = S.actual;
  const movId = v.id, raw = v.raw;
  pedirConfirmacion({
    titulo: 'Eliminar operación',
    cuerpo: `<b>${esc(v.cliente || 'Sin cliente')}</b> · ${fm(v.total)} · ${esc(v.fecha)} ${esc(v.hora)}<br>
      La operación pasa a la papelera y sale de los totales.`,
    onOk: async (motivo, pinTipo) => {
      const batch = writeBatch(db);
      batch.set(doc(db, 'papelera_movimientos', movId), {
        ...raw,
        _eliminado: { por: S.usuarioSesion, motivo, fecha_hora: serverTimestamp(), pinTipo }
      });
      batch.delete(doc(db, 'movimientos', movId));
      batch.set(doc(collection(db, 'auditoria')), {
        tipo: 'ELIMINAR', movId, usuario: S.usuarioSesion, pinTipo, motivo,
        antes: raw, fecha_hora: serverTimestamp()
      });
      await batch.commit();
    }
  });
}

$('confOk').addEventListener('click', async () => {
  const motivo = $('confMotivo').value.trim();
  const obligatorio = $('confMotivo').style.display !== 'none';
  if (obligatorio && motivo.length < 5) return toast('Escriba un motivo (mínimo 5 caracteres)');
  loader(true);
  try {
    const tipo = await verificarPin($('confPin').value);
    if (!tipo) { toast('PIN incorrecto'); return; }
    const accion = S.accion;
    cerrarConf();
    $('fichaModal').classList.remove('show');
    await accion(motivo, tipo);
    toast('Cambios guardados');
    await cargar();
  } catch (e) {
    console.error(e);
    toast('Error: ' + (e.code || e.message));
  } finally {
    loader(false);
  }
});
$('confCancelar').addEventListener('click', cerrarConf);
$('confX').addEventListener('click', cerrarConf);
$('confModal').addEventListener('click', e => { if (e.target.id === 'confModal') cerrarConf(); });

// ---------- Columnas / exportar / copiar ----------
function setCols(keys) {
  S.cols = COL_KEYS.filter(k => keys.includes(k));
  localStorage.setItem('vm_cols_mov', JSON.stringify(S.cols));
  renderPla();
}
function abrirCols() {
  $('colsGrid').innerHTML = COLS.map(c =>
    `<label class="ck"><input type="checkbox" value="${c.k}" ${S.cols.includes(c.k) ? 'checked' : ''}> ${c.l}</label>`).join('');
  $('colsModal').classList.add('show');
}
function tabla(vs, sep) {
  const cols = visibleCols();
  const head = cols.map(c => c.l).join(sep);
  const body = vs.map(v => cols.map(c => String(c.v(v) ?? '').replace(/[\r\n\t]+/g, ' ').trim()).join(sep));
  return [head, ...body].join('\n');
}
function exportarCSV() {
  const rows = S.ventas.filter(fOk).sort(ordenar);
  if (!rows.length) return toast('No hay ventas para exportar');
  const blob = new Blob(['\ufeff' + tabla(rows, ';')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `movimientos_${$('fDesde').value}_${$('fHasta').value}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function copiarSeleccion() {
  const vs = [...S.sel].map(id => S.byId.get(id)).filter(Boolean);
  const data = vs.length ? vs : S.ventas.filter(fOk).sort(ordenar);
  if (!data.length) return toast('Nada para copiar');
  navigator.clipboard?.writeText(tabla(data, '\t'))
    .then(() => toast(`Copiado: ${data.length} filas`))
    .catch(() => toast('No se pudo copiar'));
}

// ---------- Eventos ----------
function setView(v) {
  S.view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  renderAll();
}
$('btnTheme').addEventListener('click', () => {
  const dark = document.body.classList.toggle('dark');
  localStorage.setItem('vm_theme', dark ? 'dark' : 'light');
  $('btnTheme').textContent = dark ? '☀️' : '🌙';
});
$('btnVolver').addEventListener('click', () => location.href = `inicio.html?k=${TOKEN}`);
$('btnBuscar').addEventListener('click', cargar);
$('btnFiltros').addEventListener('click', () => $('panelFiltros').classList.toggle('open'));
$('fQ').addEventListener('input', e => { S.f.q = e.target.value.trim(); renderAll(); });
$('fTipo').addEventListener('change', e => { S.f.tipo = e.target.value; renderAll(); });
$('fUsr').addEventListener('change', e => { S.f.usr = e.target.value; renderAll(); });
$('btnLimpiarF').addEventListener('click', () => {
  S.f = { q: '', tipo: '', usr: '' };
  $('fQ').value = ''; $('fTipo').value = ''; $('fUsr').value = '';
  renderAll();
});
$('btnDesplegar').addEventListener('click', () => document.querySelectorAll('#vistaDet details').forEach(d => d.open = true));
$('btnContraer').addEventListener('click', () => document.querySelectorAll('#vistaDet details').forEach(d => d.open = false));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('btnCols').addEventListener('click', abrirCols);
$('btnCerrarCols').addEventListener('click', () => $('colsModal').classList.remove('show'));
$('btnColsBasicas').addEventListener('click', () => { setCols(COLS.filter(c => c.def).map(c => c.k)); abrirCols(); });
$('btnColsTodas').addEventListener('click', () => { setCols(COL_KEYS); abrirCols(); });
$('colsGrid').addEventListener('change', () => setCols([...$('colsGrid').querySelectorAll('input:checked')].map(i => i.value)));
$('btnCsv').addEventListener('click', exportarCSV);
$('btnEditar').addEventListener('click', () => {
  S.editMode = !S.editMode;
  if (S.editMode) { S.sel.clear(); setView('pla'); }
  $('btnEditar').classList.toggle('on', S.editMode);
  $('editHint').style.display = S.editMode ? 'inline' : 'none';
  renderPla();
  renderSel();
});
$('pendGuardar').addEventListener('click', guardarPendientes);
$('pendDescartar').addEventListener('click', () => { S.pend.clear(); renderPla(); renderSel(); });
$('btnCerrarFicha').addEventListener('click', () => $('fichaModal').classList.remove('show'));
$('fichaModal').addEventListener('click', e => { if (e.target.id === 'fichaModal') $('fichaModal').classList.remove('show'); });
$('colsModal').addEventListener('click', e => { if (e.target.id === 'colsModal') $('colsModal').classList.remove('show'); });
$('btnCopiar').addEventListener('click', copiarSeleccion);
$('btnLimpiarSel').addEventListener('click', () => { S.sel.clear(); renderPla(); renderSel(); });

document.addEventListener('click', e => {
  const ficha = e.target.closest('[data-ficha]');
  if (ficha) { e.stopPropagation(); abrirFicha(ficha.dataset.ficha); return; }
  const th = e.target.closest('th[data-sort]');
  if (th) {
    const k = th.dataset.sort === 'fecha' || th.dataset.sort === 'hora' ? 'ms' : th.dataset.sort;
    S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : 1 };
    renderPla();
    return;
  }
  const celdaEd = e.target.closest('td[data-edit]');
  if (celdaEd && S.editMode && !celdaEd.querySelector('input')) { abrirEdicionCelda(celdaEd); return; }
  const fila = e.target.closest('tr[data-venta]');
  if (fila && S.view === 'pla' && !S.editMode) { toggleSel(fila.dataset.venta); return; }
  const venta = e.target.closest('.sale[data-venta]');
  if (venta) abrirFicha(venta.dataset.venta);
});

// ---------- Arranque ----------
(async function init() {
  const hoy = new Date();
  $('fDesde').value = ymd(hoy);
  $('fHasta').value = ymd(hoy);
  if (localStorage.getItem('vm_theme') === 'dark') document.body.classList.add('dark');
  $('btnTheme').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  const guardadas = JSON.parse(localStorage.getItem('vm_cols_mov') || 'null');
  S.cols = Array.isArray(guardadas) && guardadas.length
    ? guardadas.filter(k => COL_KEYS.includes(k))
    : COLS.filter(c => c.def).map(c => c.k);
  if (await validarSesion()) await cargar();
})();
</script>
